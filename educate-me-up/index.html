<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educate Me Up · Online English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a4a;--navy2:#1d4e89;--gold:#f5c542;--bg:#f6f7fb;--card:#fff;--line:#e3e8f0;--txt:#1d2433;--mut:#64708a;--green:#1e9e6a;--red:#d64545;--amber:#b7791f;--teal:#12a5a0;--coral:#ff7a59}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Cairo,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.ar{font-family:Cairo,sans-serif;direction:rtl}
a{color:var(--navy2)}
button{font-family:inherit;cursor:pointer}
.demo{background:#111827;color:#cbd5e1;display:flex;gap:6px;align-items:center;padding:7px 14px;flex-wrap:wrap;font-size:12px}
.demo b{color:#fff;margin-right:6px}
.demo button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:20px;padding:5px 12px;font-size:12px}
.demo button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.demo .reset{margin-left:auto;background:transparent;border-color:#4b5563}
.top{background:var(--navy);border-bottom:4px solid var(--gold);color:#fff;display:flex;align-items:center;padding:12px 22px;gap:14px}
.logo{font-weight:800;font-size:22px;letter-spacing:.2px}
.logo span{color:var(--gold)}
.top .who{margin-left:auto;font-size:13px;opacity:.9}
.wrap{max-width:1150px;margin:0 auto;padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:850px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(15,42,74,.05)}
h1,h2,h3{margin:0 0 10px;color:var(--navy)}
h2{font-size:19px}h3{font-size:15px}
.mut{color:var(--mut)}
.small{font-size:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:9px 16px;font-weight:600;font-size:13px}
.btn.gold{background:var(--gold);color:#111}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:8px 0 4px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.s-new{background:#e8eefb;color:#2b4fa8}.s-pay{background:#fff3d6;color:#9a6a00}.s-paid{background:#e3f4ea;color:var(--green)}
.s-sch{background:#e6f0ff;color:#174ea6}.s-done{background:#eceff3;color:#4b5563}.s-can{background:#fde8e6;color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat .n{font-size:24px;font-weight:800;color:var(--navy)}
.hero{background:radial-gradient(circle at 88% 12%,rgba(245,197,66,.35),transparent 38%),radial-gradient(circle at 5% 95%,rgba(18,165,160,.35),transparent 35%),linear-gradient(135deg,#0f2a4a,#1d4e89);color:#fff;border-radius:18px;padding:38px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero h1{color:#fff;font-size:36px;line-height:1.15}
.hero h1 span{color:var(--gold)}
.hero p{opacity:.9;line-height:1.7}
@media(max-width:850px){.hero{grid-template-columns:1fr;padding:24px}.hero h1{font-size:26px}}
.price{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:16px}
.price .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.price .row:last-child{border:0}
.price b{color:var(--gold)}
.yr{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.yr .tag{font-size:11px;color:var(--mut);font-weight:600}
.steps{counter-reset:s}
.steps div{counter-increment:s;padding:10px 0 10px 40px;position:relative}
.steps div:before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#111;font-weight:800;text-align:center;line-height:28px}
.notice{background:#fff8e6;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;font-size:13px}
.ok{background:#eef8f2;border:1px solid #bfe3cd;border-radius:10px;padding:10px 14px;font-size:13px}
.sess{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
.sess .when{min-width:96px;text-align:center;background:var(--bg);border-radius:10px;padding:8px}
.sess .when b{display:block;font-size:18px;color:var(--navy)}
.sess .grow{flex:1}
.wk{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.wk summary{padding:12px 14px;font-weight:600;cursor:pointer;color:var(--navy);display:flex;justify-content:space-between}
.wk .body{padding:0 14px 14px}
.cat{margin-top:10px}
.cat h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.mat{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--txt);font-size:13px}
.mat:hover{background:var(--bg)}
.ic{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.i-plan{background:#2b4fa8}.i-study{background:#0f766e}.i-quiz{background:#7c3aed}.i-hw{background:#c2410c}.i-practice{background:#be185d}
.chat{display:grid;grid-template-columns:240px 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-height:420px}
@media(max-width:850px){.chat{grid-template-columns:1fr}}
.threads{border-right:1px solid var(--line);background:#fafbfd}
.threads div{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.threads div.on{background:#fff;border-left:4px solid var(--gold)}
.msgs{display:flex;flex-direction:column}
.msglist{flex:1;padding:14px;overflow:auto;max-height:420px}
.m{max-width:75%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.5}
.m .meta{font-size:10px;color:var(--mut);margin-top:3px}
.m.me{margin-left:auto;background:var(--navy);color:#fff}.m.me .meta{color:#cbd5e1}
.m.them{background:var(--bg)}
.m.blocked{background:#fde8e6;color:var(--red);border:1px dashed var(--red)}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:13px}
.flag{color:var(--red);font-weight:700}
.right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock{font-size:12px;color:var(--mut);background:var(--bg);border-radius:8px;padding:6px 10px;display:inline-block}
@media(max-width:850px){.sess{flex-wrap:wrap}.sess .grow{min-width:60%}.sess .row{width:100%}.top{flex-wrap:wrap}.top .who{margin-left:0;width:100%}}
.memes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:850px){.memes{grid-template-columns:1fr 1fr}.meme .pic{font-size:34px;white-space:nowrap}.meme .cap{font-size:15px}}
.meme{border-radius:16px;padding:16px;color:var(--txt);background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--gold));box-shadow:0 2px 8px rgba(15,42,74,.05)}
.meme .pic{font-size:54px;line-height:1;margin:6px 0 10px}
.meme .cap{font-weight:700;font-size:15px;line-height:1.35}
.meme .sub{font-size:12px;margin-top:6px;opacity:.8}
.prog{border-radius:16px;padding:18px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--c);position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(15,42,74,.05)}
.prog h3{color:var(--navy);font-size:17px}
.prog .tag{display:inline-block;background:var(--bg);color:var(--c);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:8px}
.prog .em{position:absolute;right:12px;bottom:6px;font-size:40px}
.prog p{font-size:13px;color:var(--mut);margin:6px 0 4px}
.prog .ar{font-size:13px;color:var(--mut);margin:0 0 34px;text-align:right}
.bi .ar{display:block;color:var(--mut);font-size:13px;margin-top:2px;text-align:right}
.price .bi .ar,.hero .bi .ar{color:rgba(255,255,255,.8)}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat .fi{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:12px 18px}
.copybox{background:#f3f6fb;border:1px dashed #9db3d6;border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap;font-family:Cairo,Poppins,sans-serif}
.fly{background:linear-gradient(135deg,#fff4d6,#ffe1d6);border:2px solid var(--gold);border-radius:18px;padding:22px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media(max-width:850px){.fly{grid-template-columns:1fr}}
.fly h2{font-size:24px}
.bolt{display:inline-block;background:var(--navy);color:var(--gold);border-radius:12px;padding:4px 10px;font-weight:800;font-size:12px;letter-spacing:.5px}
.flytag{display:inline-block;background:#fff4d6;color:#9a6a00;border:1px solid var(--gold);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px}
.footer{text-align:center;color:var(--mut);font-size:12px;padding:30px}


.pbar{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden;margin:8px 0}.pbar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .5s}
.timer{text-align:center;background:#f7f4ea;border-radius:12px;padding:10px 14px;min-width:190px}.timer .clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}.timer .clock.over{color:#c62828}
.pstep{display:flex;gap:12px;border:1px solid #e3e7ee;border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.pstep.now{border:2px solid var(--gold);background:#fffbef;box-shadow:0 2px 10px rgba(224,178,80,.25)}.pstep.past{opacity:.6}.pstep.ticked{opacity:.55}
.pstep h3{margin:0 0 4px;font-size:16px}.pstep ul{margin:2px 0 6px;padding-left:18px}.pstep li{margin:2px 0}
.pstep>.grow{flex:1;min-width:0}
.pmin{min-width:58px;text-align:center;font-weight:800;color:var(--navy);font-size:15px}.pmin span{display:block;font-size:11px;color:var(--mut);font-weight:600}
.psay{background:#eef5ff;border-radius:8px;padding:6px 9px;margin:4px 0;font-size:14px}.ptip{background:#fbf6e8;border-radius:8px;padding:6px 9px;margin:4px 0;font-size:14px}
.pchk{white-space:nowrap;font-size:13px;color:var(--mut)}.pchk input{width:auto}
.pstep details summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:13px;margin-top:4px}
@media(max-width:700px){.pstep{flex-wrap:wrap}.timer{width:100%;margin-top:10px}}

/* ---- mobile ---- */
img,input,select,textarea{max-width:100%}
input[type=file]{width:100%;font-size:12px}
.mat{overflow-wrap:anywhere;word-break:break-word}
.card,.sess,.wk,.prog,.meme{min-width:0}
.grid>*{min-width:0}
@media(max-width:700px){
  .wrap{padding:14px}
  .demo{padding:6px 10px;gap:4px}.demo b{display:none}.demo button{padding:4px 9px;font-size:11px}.demo .reset{margin-left:0}
  .top{padding:10px 14px;gap:4px}.logo{font-size:20px}.top .small{display:none}.top .who{font-size:12px}
  .hero{padding:20px;border-radius:14px}.hero h1{font-size:26px}
  .hero .wa,.hero .btn{display:flex;justify-content:center;margin:8px 0 0!important;width:100%}
  .price .row{flex-direction:row;gap:10px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .tabs button{white-space:nowrap;flex:none;padding:7px 12px;font-size:13px}
  table,tbody,tr,td{display:block;width:100%}
  tr:has(th){display:none}
  tr{border:1px solid var(--line);border-radius:12px;padding:8px 6px;margin-bottom:10px;background:#fff}
  tr:nth-child(even) td{background:transparent}
  td{border:0;padding:3px 8px}
  td.right{text-align:left;padding-top:8px}
  td .btn{width:100%}
  td[data-label]:not([data-label=''])::before{content:attr(data-label);display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  .card>table{margin:0}
  .sess{flex-wrap:wrap;padding:12px}
  .sess .when{min-width:72px}
  .sess .row{width:100%}.sess .row .btn{flex:1;text-align:center}
  .chat{grid-template-columns:1fr;min-height:0}
  .threads{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .threads div{white-space:nowrap;border-bottom:0;border-right:1px solid var(--line)}
  .threads div.on{border-left:0;border-bottom:3px solid var(--gold)}
  .m{max-width:88%}
  .modal{padding:8px;align-items:flex-end}
  .modal .card{max-height:92vh;border-radius:16px 16px 0 0}
  .memes{grid-template-columns:1fr}
  .fly{padding:16px}
  h2{font-size:18px}
  .row>.btn{flex:1}
}
</style>
</head>

/* ---------- curriculum helpers ---------- */
function catOf(m){const g=(m.g||'').toLowerCase();if(m.k==='hw')return'hw';if(g.includes('weekly plan'))return'plan';if(g.includes('quiz'))return'quiz';if(g.includes('practice')||g.includes('video'))return'practice';return'study'}
const CATS=[['plan','Weekly Plan','P'],['study','Study Materials','S'],['quiz','Quizzes & Marking Schemes','Q'],['practice','Practice Links','L'],['hw','Homework (Google Classroom)','H']];
function weekCats(w){const o={};const seen=new Set();for(const m of w.mats){const c=catOf(m);const k=c+m.u;if(seen.has(k))continue;seen.add(k);(o[c]=o[c]||[]).push(m)}return o}
function weekLabel(w){return w?(w.term?`Term ${w.term} · Week ${w.week}`:`Week ${w.week}`):'Materials being prepared'}
function weekBox(y,idx,open){const w=CUR[y].weeks[idx];if(!w)return'<div class="mut">No materials for this week yet.</div>';const c=weekCats(w);
  return `<details class="wk" ${open?'open':''}><summary><span>${weekLabel(w)}</span><span class="mut small">${w.mats.length} items</span></summary><div class="body">`+
  CATS.filter(([k])=>c[k]).map(([k,n,l])=>`<div class="cat"><h4>${n}</h4>${c[k].map(m=>`<a class="mat" href="${m.u}" target="_blank" rel="noopener"><span class="ic i-${k}">${l}</span>${esc(m.t||m.g)}</a>`).join('')}</div>`).join('')+`</div></details>`}

swer aloud or in the chat; correct the punctuation every time."], "content": ["Choose the best FANBOYS: I wanted to go to the match, ___ I had too much homework.", "Choose the best FANBOYS: The shop was closed, ___ we went home.", "Choose the best FANBOYS: She was very tired, ___ she kept working until midnight.", "Choose the best FANBOYS: He didn't eat breakfast, ___ did he eat lunch.", "Choose the best FANBOYS: We must leave now, ___ we will miss the train.", "Choose the best FANBOYS: The old man smiled, ___ he had finally found his son.", "Comma or no comma? Mona wrote the report and sent it to her teacher.", "Comma or no comma? Mona wrote the report and her teacher marked it.", "Comma or no comma? Do you prefer maths or science?", "Correct the mistake: The film was boring, I left early.", "Join with for: She wore a coat. It was freezing outside.", "Rewrite using so: We cancelled the trip, for the weather was terrible.", "Join with nor: He did not say sorry. He did not offer to help."], "answers": ["but (contrast)", "so (result)", "yet (surprising contrast). but is also correct.", "nor (second negative + did he)", "or (warning = otherwise)", "for (reason = because)", "No comma — sent has no new subject (two verbs, one subject).", "Comma: Mona wrote the report, and her teacher marked it. (new subject her teacher + verb marked)", "No comma — or joins two words.", "Comma splice. ✓ The film was boring, so I left early.", "She wore a coat, for it was freezing outside.", "The weather was terrible, so we cancelled the trip.", "He did not say sorry, nor did he offer to help."]}, {"from": 55, "to": 60, "title": "Exit check", "do": ["Exit check: each student writes one sentence with yet and one with nor. Explain the homework and the practice quiz."]}], "link": "https://abdelkriemacademy.com/aws-s1-fanboys.html"}, {"week": 1, "n": 2, "title": "Session 2 — Subordinating Conjunctions", "aim": "Explain what a subordinating conjunction does to a clause · Use the most common subordinating conjunctions with the right meaning · Use a comma after a dependent clause at the start (DC, IC) and no comma in IC DC · Never use although + but, or because + so, in the same sentence", "steps": [{"from": 0, "to": 7, "title": "Review FANBOYS", "do": ["Review FANBOYS: students join 3 pairs of sentences with FANBOYS and say the comma rule."]}, {"from": 7, "to": 15, "title": "What a subordinating conjunction does", "do": ["What a subordinating conjunction does: turn an IC into a DC on the board. Show that a DC alone is a fragment."]}, {"from": 15, "to": 35, "title": "The conjunctions by meaning (table), then each box", "do": ["The conjunctions by meaning (table), then each box. Students make an example for every conjunction. Focus on although + but, because + so, since (two meanings), unless, and the present tense after until/when/once."]}, {"from": 35, "to": 45, "title": "The comma rule", "do": ["The comma rule: DC, IC vs IC DC. Students flip 4 sentences from one order to the other and move the comma."]}, {"from": 45, "to": 55, "title": "Practice in the session (Section 6)", "do": ["Practice in the session (Section 6)."], "content": ["Choose: ___ she was very tired, she finished the essay. (Although / Because)", "Choose: Stay inside ___ the rain stops. (until / since)", "Choose: I have known Omar ___ we were six. (since / while)", "Choose: ___ you hurry, you will be late. (If / Unless)", "Choose: She studied hard ___ she could get a scholarship. (so that / because)", "Choose: ___ I was walking home, I saw an accident. (While / Once)", "Add the comma if needed: When the film ended we went home.", "Add the comma if needed: We went home when the film ended.", "Correct: Although the hotel was expensive, but the rooms were small.", "Correct: Because it was raining. We stayed at home.", "Correct: I will call you when I will arrive.", "Rewrite with although: The task was difficult, but we finished it."], "answers": ["Although (contrast)", "until", "since (time, present perfect)", "Unless (= if you don't hurry)", "so that (purpose)", "While (during a longer action)", "When the film ended, we went home. (DC, IC)", "No comma (IC DC).", "Although the hotel was expensive, the rooms were small. (or: The hotel was expensive, but the rooms were small.)", "Fragment. ✓ Because it was raining, we stayed at home.", "I will call you when I arrive.", "Although the task was difficult, we finished it."]}, {"from": 55, "to": 60, "title": "Exit check", "do": ["Exit check: one sentence with although (DC, IC) and one with unless. Explain the homework and practice quiz."]}], "link": "https://abdelkriemacademy.com/aws-s2-subordinating.html"}, {"week": 2, "n": 3, "title": "Session 3 — Correlative Conjunctions", "aim": "Use the common correlative pairs with the right meaning · Keep the same kind of word after each half of the pair · Choose the right verb after either … or / neither … nor / both … and · Review: choose correctly between FANBOYS and subordinating conjunctions", "steps": [{"from": 0, "to": 8, "title": "Review FANBOYS and subordinating", "do": ["Review FANBOYS and subordinating: students rewrite one sentence three ways (FANBOYS / DC, IC / IC DC)."]}, {"from": 8, "to": 18, "title": "Introduce correlative pairs (table)", "do": ["Introduce correlative pairs (table). Students give one example for each pair."]}, {"from": 18, "to": 35, "title": "The five rules", "do": ["The five rules: balance, verb agreement, neither … nor, Not only + inversion, punctuation. Do each rule with 2 quick student sentences and correct live."]}, {"from": 35, "to": 45, "title": "Review table", "do": ["Review table: which joining word? Students choose between FANBOYS, subordinating and correlative for the same idea."]}, {"from": 45, "to": 55, "title": "Practice in the session (Section 5)", "do": ["Practice in the session (Section 5)."], "content": ["Complete: ___ Cairo and Alexandria are on the Nile Delta.", "Complete: You can ___ stay here or come with us.", "Complete: ___ the manager nor his assistant answered the phone.", "Complete: The film was not only long ___ boring.", "Choose the verb: Neither the players nor the coach (was / were) happy.", "Choose the verb: Both the house and the garden (needs / need) repairs.", "Correct: He doesn't eat neither meat nor fish.", "Correct: She is not only smart but also she is kind.", "Rewrite with Not only: The storm damaged houses. It also destroyed the bridge.", "Join with a subordinating conjunction: It was late. We kept working.", "Join with FANBOYS: He didn't call. He didn't write."], "answers": ["Both (both … and)", "either", "Neither", "but also", "was (nearer subject: the coach)", "need (both … and = plural)", "He eats neither meat nor fish. / He doesn't eat either meat or fish.", "She is not only smart but also kind. (balance)", "Not only did the storm damage houses, but it also destroyed the bridge.", "Although it was late, we kept working.", "He didn't call, nor did he write."]}, {"from": 55, "to": 60, "title": "Exit check", "do": ["Exit check: one Not only … but also sentence with inversion. Explain the homework and practice quiz."]}], "link": "https://abdelkriemacademy.com/aws-s3-correlative.html"}, {"week": 2, "n": 4, "title": "Session 4 — Conjunctive Adverbs", "aim": "Use the common conjunctive adverbs with the right meaning · Punctuate them correctly: IC; however, IC · IC. However, IC · IC, however, IC · Never join two independent clauses with a comma + however (comma splice) · Choose between all four types of conjunctions to say the same idea in different ways", "steps": [{"from": 0, "to": 8, "title": "Review", "do": ["Review: give one idea and ask for FANBOYS, DC, IC and IC DC versions. Show that however cannot join with a comma."]}, {"from": 8, "to": 20, "title": "Conjunctive adverbs by meaning (table) and the six boxes", "do": ["Conjunctive adverbs by meaning (table) and the six boxes. Students make one sentence for each group."]}, {"from": 20, "to": 35, "title": "Punctuation rules", "do": ["Punctuation rules: four positions. Board race: students punctuate 6 sentences; the class finds every comma splice."]}, {"from": 35, "to": 45, "title": "Review table", "do": ["Review table: one idea, four structures. Each student writes one idea four ways and reads them aloud."]}, {"from": 45, "to": 55, "title": "Practice in the session (Section 5)", "do": ["Practice in the session (Section 5)."], "content": ["Choose: The road was blocked; ___, we took another route. (however / therefore)", "Choose: He was ill; ___, he came to school. (nevertheless / moreover)", "Choose: Recycling saves energy. ___, it reduces waste. (Furthermore / Instead)", "Choose: Hurry up; ___, we'll be late. (otherwise / for example)", "Punctuate: The flight was delayed however we arrived on time", "Punctuate: The flight however was delayed", "Correct: I studied all night, therefore I passed.", "Correct: The hotel was cheap but however it was dirty.", "Write the idea in four structures: It was expensive. We bought it."], "answers": ["therefore (result)", "nevertheless (contrast)", "Furthermore (addition)", "otherwise", "The flight was delayed; however, we arrived on time. (or: … delayed. However, we …)", "The flight, however, was delayed.", "I studied all night; therefore, I passed.", "The hotel was cheap, but it was dirty. / The hotel was cheap; however, it was dirty.", "It was expensive, but we bought it. · Although it was expensive, we bought it. · We bought it although it was expensive. · It was expensive; however, we bought it."]}, {"from": 55, "to": 60, "title": "Exit check", "do": ["Exit check: one sentence with ; therefore, and one starting with However,. Explain the homework, practice quiz and the Week 2 quiz."]}], "link": "https://abdelkriemacademy.com/aws-s4-conjunctive-adverbs.html"}, {"week": 3, "n": 5, "title": "Session 5 — Phrases and Clauses: Independent and Dependent", "aim": "Tell the difference between a phrase and a clause · Find the subject and verb in any clause · Identify independent and dependent clauses quickly · Recognise adverb, relative and noun clauses, and review all four types of conjunctions", "steps": [{"from": 0, "to": 5, "title": "Warm-up", "do": ["Warm-up: show after the match and after the match ended. Ask: what is the difference?"]}, {"from": 5, "to": 17, "title": "Phrase vs clause; finding subject and verb", "do": ["Phrase vs clause; finding subject and verb. Students find the subject + verb in 6 sentences on the board."]}, {"from": 17, "to": 30, "title": "IC vs DC with the stand-alone test", "do": ["IC vs DC with the stand-alone test. Students turn ICs into DCs by adding a subordinating conjunction, then complete them."]}, {"from": 30, "to": 42, "title": "Three types of DC (adverb, relative, noun), relative-clause ", "do": ["Three types of DC (adverb, relative, noun), relative-clause commas."]}, {"from": 42, "to": 50, "title": "Review how each conjunction type connects clauses; count the", "do": ["Review how each conjunction type connects clauses; count the clauses in 4 sentences (preparing Session 6)."]}, {"from": 50, "to": 60, "title": "Practice in the session (Section 5) and exit check", "do": ["Practice in the session (Section 5) and exit check: write one sentence with a DC and an IC and label them."], "content": ["Phrase or clause? under the old bridge", "Phrase or clause? when the bridge collapsed", "Phrase or clause? to finish the project on time", "IC or DC? Because she was late.", "IC or DC? She was late.", "IC or DC? Which was the best book in the library.", "Underline the subject and circle the verb: The old man in the blue coat walked slowly.", "What type of DC? The city where I was born is very old.", "What type of DC? I think that you are right.", "What type of DC? If you study, you will pass.", "How many clauses? When the bell rang, the students packed their bags and they ran outside.", "Add commas: My teacher who is from Aswan speaks four languages."], "answers": ["phrase (no subject + verb)", "clause (the bridge + collapsed) — a DC", "phrase (to finish is not a main verb)", "DC — it needs an IC (fragment on its own)", "IC", "DC (relative clause)", "subject: The old man (in the blue coat) · verb: walked", "relative clause (describes the city)", "noun clause (object of think)", "adverb clause (condition)", "3: DC (the bell rang) + IC (the students packed) + IC (they ran)", "My teacher, who is from Aswan, speaks four languages. (extra information)"]}], "link": "https://abdelkriemacademy.com/aws-s5-clauses-phrases.html"}, {"week": 3, "n": 6, "title": "Session 6 — Sentence Structure: Simple, Compound, Complex and Compound-Complex", "aim": "Write the formula for each of the four sentence structures · Join two ICs in the three correct ways · Build complex sentences in both orders with the right comma · Build and identify compound-complex sentences", "steps": [{"from": 0, "to": 5, "title": "Warm-up", "do": ["Warm-up: students count the clauses in 4 sentences and mark IC / DC (Session 5 review)."]}, {"from": 5, "to": 13, "title": "The four formulas on the board", "do": ["The four formulas on the board. Students copy them; teacher gives one example each."]}, {"from": 13, "to": 25, "title": "Simple and compound", "do": ["Simple and compound: the three ways to join two ICs; comma splice and run-on warnings. Students join 3 pairs three ways."]}, {"from": 25, "to": 35, "title": "Complex", "do": ["Complex: DC, IC vs IC DC; relative clauses. Students flip sentences and move the comma."]}, {"from": 35, "to": 45, "title": "Compound-complex", "do": ["Compound-complex: build in steps (compound first, then add a DC). Students build 3 using the formulas."]}, {"from": 45, "to": 55, "title": "Practice in the session (Section 7) and the 3-step identific", "do": ["Practice in the session (Section 7) and the 3-step identification method. Exit check: write one sentence of each type."], "content": ["Identify: My cousin and I watched the match on TV.", "Identify: My cousin watched the match, but I went to bed.", "Identify: I went to bed before the match ended.", "Identify: Before the match ended, I went to bed, but my cousin stayed up.", "Identify: The match that we watched was exciting.", "Join in three compound ways: The museum was closed. We visited the park.", "Make it complex (DC, IC): The museum was closed. We visited the park.", "Make it complex (IC DC): same sentences", "Make it compound-complex: add a DC to The museum was closed, so we visited the park.", "Fix: The bus was late, we walked to school.", "Fix: Because the bus was late, so we walked."], "answers": ["simple (1 IC with a compound subject)", "compound (IC, but IC)", "complex (IC DC)", "compound-complex (DC, IC, but IC)", "complex (relative clause inside the IC)", "…closed, so we visited the park. · …closed; we visited the park. · …closed; therefore, we visited the park.", "Because the museum was closed, we visited the park.", "We visited the park because the museum was closed.", "e.g. Because it was Friday, the museum was closed, so we visited the park.", "comma splice → The bus was late, so we walked to school. / …late; we walked…", "Because the bus was late, we walked. (complex) / The bus was late, so we walked. (compound)"]}], "link": "https://abdelkriemacademy.com/aws-s6-sentence-types.html"}, {"week": 4, "n": 7, "title": "Session 7 — Sentence Errors and Effective Sentences", "aim": "Find and fix fragments, run-ons (fused sentences) and comma splices · Explain what each sentence structure does in a piece of writing · Vary sentence length and sentence openings · Improve a weak paragraph using all four structures", "steps": [{"from": 0, "to": 7, "title": "Warm-up", "do": ["Warm-up: show three sentences (a fragment, a run-on, a comma splice). Ask: what is wrong with each?"]}, {"from": 7, "to": 20, "title": "The three errors and the fixes", "do": ["The three errors and the fixes: fragments (5 types), then run-ons/splices (5 fixes). Students fix 6 sentences, each with a different method."]}, {"from": 20, "to": 32, "title": "What each structure does (table) and the rules for effective", "do": ["What each structure does (table) and the rules for effective writing: variety of structure, length and openings."]}, {"from": 32, "to": 44, "title": "Model", "do": ["Model: read the weak paragraph, students find the errors, then compare with the improved version and label each sentence."]}, {"from": 44, "to": 54, "title": "Practice in the session (Section 6)", "do": ["Practice in the session (Section 6)."], "content": ["Fragment, run-on, comma splice or correct? After the long and tiring journey home.", "Fragment, run-on, comma splice or correct? The shop was closed we went to another one.", "Fragment, run-on, comma splice or correct? The shop was closed, we went to another one.", "Fragment, run-on, comma splice or correct? Although the shop was closed, the café was open.", "Fix in two different ways: I love football, my brother prefers tennis.", "Which structure would you use for a short, dramatic sentence in a story?", "Combine into one complex sentence: The scientists tested the water. They found high levels of plastic.", "Rewrite with a different opening: I think that uniforms are a good idea because they save time."], "answers": ["fragment → After the long and tiring journey home, we slept for ten hours.", "run-on → The shop was closed, so we went to another one.", "comma splice → The shop was closed; we went to another one.", "correct (DC, IC)", "I love football, but my brother prefers tennis. · I love football, whereas my brother prefers tennis. / I love football; however, my brother prefers tennis.", "simple — e.g. The door slammed.", "When the scientists tested the water, they found high levels of plastic.", "e.g. Because they save time every morning, uniforms are a good idea."]}, {"from": 54, "to": 60, "title": "Students choose their Part D topic and plan 3 points", "do": ["Students choose their Part D topic and plan 3 points. Explain that the first draft must be submitted before Session 8."]}], "link": "https://abdelkriemacademy.com/aws-s7-errors-effective-sentences.html"}, {"week": 4, "n": 8, "title": "Session 8 — Writing Workshop: From First Draft to Final Draft", "aim": "Plan and write an academic paragraph (topic sentence, support, conclusion) · Use the correction codes to find and fix your own mistakes · Rewrite a first draft into a second and final draft · Use all four conjunction types and all four sentence structures accurately", "steps": [{"from": 0, "to": 5, "title": "Return the first drafts with correction codes", "do": ["Return the first drafts with correction codes. Explain the codes table."]}, {"from": 5, "to": 15, "title": "The academic paragraph structure and the model paragraph", "do": ["The academic paragraph structure and the model paragraph: students label every sentence and find all four conjunction types."]}, {"from": 15, "to": 25, "title": "Self-correction", "do": ["Self-correction: students fix every code on their own first draft (teacher circulates / checks on screen)."]}, {"from": 25, "to": 45, "title": "Second draft written live in the session; teacher reads and ", "do": ["Second draft written live in the session; teacher reads and corrects sentence by sentence with the student."]}, {"from": 45, "to": 55, "title": "Checklist and practice (Section 6)", "do": ["Checklist and practice (Section 6)."]}, {"from": 55, "to": 60, "title": "Explain the final draft homework, the Week 4 final test and ", "do": ["Explain the final draft homework, the Week 4 final test and how the course grade is calculated. Celebrate progress."]}], "link": "https://abdelkriemacademy.com/aws-s8-writing-workshop.html"}]}};

function phoneKey(p){let d=String(p||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');if(d.startsWith('0020'))d=d.slice(4);else if(d.startsWith('20')&&d.length===12)d=d.slice(2);if(d.length===10&&d.startsWith('1'))d='0'+d;return d}
function loginEmail(id){id=String(id||'').trim();return id.includes('@')?id.toLowerCase():'p'+phoneKey(id)+LOGIN_DOMAIN}
function newCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';const r=crypto.getRandomValues(new Uint32Array(6));for(const x of r)c+=a[x%a.length];return c}
function clean(o){return JSON.parse(JSON.stringify(o))}
function derive(c,x){
  if(c==='messages'&&x.thread){const p=x.thread.split(':');x.fam=p[0]==='fam'?p[1]:p[0]==='tf'?p[2]:null;x.teacher=(p[0]==='tf'||p[0]==='staff')?p[1]:null}
  if(c==='families'&&role==='admin'){x.teacherIds=[...new Set(S.sessions.filter(s=>s.fam===x.id&&s.teacher).map(s=>s.teacher))].sort()}
  if(c==='hw'){const f=S.families.find(y=>y.id===x.fam);x.teacherIds=(f&&f.teacherIds)||x.teacherIds||[]}
}
function writeDoc(c,x){const d=clean(x);const ops=[db.collection(c).doc(x.id).set(d,{merge:true})];
  if(c==='teachers'){if(role==='admin')ops.push(db.collection('teacherPublic').doc(x.id).set({name:x.name,years:x.years||[],avail:!!x.avail},{merge:true}));else ops.push(db.collection('teacherPublic').doc(x.id).set({avail:!!x.avail},{merge:true}))}
  return Promise.all(ops)}
function save(){const ops=[];
  COLS.forEach(c=>{const seen=new Set();(S[c]||[]).forEach(x=>{if(!x||!x.id)return;if(c==='teachers'&&x._pub)return;derive(c,x);const j=JSON.stringify(x);seen.add(x.id);if(CACHE[c][x.id]!==j){CACHE[c][x.id]=j;ops.push(writeDoc(c,x))}});
    if(role==='admin')Object.keys(CACHE[c]).forEach(id=>{if(!seen.has(id)){delete CACHE[c][id];ops.push(db.collection(c).doc(id).delete())}})});
  if(ops.length)Promise.all(ops).catch(e=>{console.error(e);toast('⚠ Not saved – '+(e.code==='permission-denied'?'no permission':e.message))})}
function upsert(c,d){const arr=S[c];const i=arr.findIndex(x=>x.id===d.id);if(i>=0)arr[i]=d;else arr.push(d)}
function sortS(){const t=x=>new Date(x.at||0).getTime();S.messages.sort((a,b)=>t(a)-t(b));S.requests.sort((a,b)=>t(b)-t(a));S.flying.sort((a,b)=>t(b)-t(a))}
let _rt=null;function soon(){clearTimeout(_rt);_rt=setTimeout(()=>{const busy=document.getElementById('layer').innerHTML!==''||['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName);if(busy){soon();return}render()},250)}
function listen(q,c,opt){opt=opt||{};UNSUB.push(q.onSnapshot(snap=>{
    const docs=snap.docChanges?snap.docChanges():[{type:snap.exists?'modified':'removed',doc:snap}];
    docs.forEach(ch=>{const d=Object.assign({id:ch.doc.id},ch.doc.data()||{});if(opt.pub){if(d.id===S.me.teacher)return;d._pub=true}
      if(ch.type==='removed'){const i=S[c].findIndex(x=>x.id===d.id);if(i>=0)S[c].splice(i,1);delete CACHE[c][d.id]}
      else{upsert(c,d);if(!opt.pub)CACHE[c][d.id]=JSON.stringify(d)}});
    sortS();LOADING=false;soon()},e=>{console.warn(c,e.code||e)}))}
function startListeners(){const C=n=>db.collection(n);
  if(role==='admin'){COLS.forEach(c=>listen(C(c),c));return}
  if(role==='teacher'){const t=S.me.teacher;listen(C('teachers').doc(t),'teachers');listen(C('teacherPublic'),'teachers',{pub:true});
    listen(C('sessions').where('teacher','==',t),'sessions');listen(C('families').where('teacherIds','array-contains',t),'families');
    listen(C('hw').where('teacherIds','array-contains',t),'hw');listen(C('reports').where('teacher','==',t),'reports');listen(C('messages').where('teacher','==',t),'messages');return}
  if(role==='parent'){const f=S.me.parent;listen(C('families').doc(f),'families');listen(C('teacherPublic'),'teachers',{pub:true});
    ['sessions','hw','reports','messages'].forEach(c=>listen(C(c).where('fam','==',f),c))}}

  if(!p){toast('This account has no access. Please contact the academy.');await auth.signOut();return}
  ME=p;role=p.role;S.me={parent:p.fam||null,teacher:p.teacher||null};tab=null;thread=null;LOADING=true;startListeners();render();scrollTo(0,0)});
async function createLogin(kind,id,phone,name,code){code=code||newCode();
  const sec=firebase.apps.find(a=>a.name==='creator')||firebase.initializeApp(FB,'creator');
  const cred=await sec.auth().createUserWithEmailAndPassword(loginEmail(phone),code);
  const prof={role:kind,name:name||'',phone:phoneKey(phone)};prof[kind==='parent'?'fam':'teacher']=id;

  await db.collection('codes').doc(id).set({kind,phone:phoneKey(phone),code,uid:cred.user.uid,at:new Date().toISOString()});
  await sec.auth().signOut();return code}
async function loginInfo(kind,id,phone,name){

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const fam=id=>S.families.find(f=>f.id===id)||{id,parent:'…',student:'…',phone:'',email:'',year:'gen',type:'private',week:0};
const tch=id=>S.teachers.find(t=>t.id===id)||{id,name:'Teacher',rate:0,years:[],avail:false};
const short=n=>{const p=n.split(' ');return p[0]+(p[1]?' '+p[1][0]+'.':'')};
function fmt(d){if(!d)return'—';const x=new Date(d);return x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function day(d){const x=new Date(d);return{d:x.toLocaleDateString('en-GB',{day:'numeric'}),m:x.toLocaleDateString('en-GB',{month:'short'}),t:x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}}
const ST={new:['New request','s-new'],pending:['Awaiting payment','s-pay'],paid:['Paid – needs schedule','s-paid'],scheduled:['Scheduled','s-sch'],done:['Completed','s-done'],cancelled:['Cancelled','s-can']};
const pill=s=>`<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function joinable(s){if(!s.when)return false;const diff=new Date(s.when)-Date.now();return diff<15*60000&&diff>-90*60000}
const money=(n,c)=>Number(n).toLocaleString('en-US')+' '+(c||'EGP');

function contactLeak(t){const n=t.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s\-\.]/g,'');
  return /\d{8,}/.test(n)||/\+?20\d{6,}/.test(n)||/[\w.+-]+@[\w-]+\.\w+/.test(t)||/(https?:\/\/|www\.|\.com\b)/i.test(t)||/(whats\s?app|wa\.me|telegram|instagram|facebook|snap|واتس|تليجرام|انستا|رقمي|رقم\s?تليفون|نمرتي)/i.test(t)}

    (hwWeeks(f).map(({i,w,tasks})=>{const h=hwOf(f.id,i);return `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${weekLabel(w)}</h3>${hwStatus(h)}</div>
      <div style="margin-top:8px">${tasks.map(m=>`<a class="mat" href="${m.u}" target="_blank" rel="noopener"><span class="ic i-hw">H</span>${esc(m.t)}</a>`).join('')||'<span class="mut small">No homework this week.</span>'}</div>
      ${h?`<div class="small mut" style="margin-top:6px">Uploaded: ${h.files.map(esc).join(', ')}</div>`:''}
      ${h&&h.status==='returned'?`<div class="ok" style="margin-top:8px"><b>Mark: ${h.mark} / ${h.total}</b> · ${esc(h.feedback)}<div class="small" style="margin-top:4px">📎 Corrected copy: ${esc(h.corrected||'—')}</div></div>`:''}
      ${tasks.length?`<div class="row" style="margin-top:10px">${CLASSROOM[f.year]?`<a class="btn ghost" href="${CLASSROOM[f.year]}" target="_blank" rel="noopener">Open Google Classroom ↗</a>`:''}<button class="btn gold" data-hwup="${i}">${h?'I submitted it again · سلّمته تاني':'I submitted it · سلّمته'}</button></div>`:''}</div>`}).join('')||'<div class="card mut">No homework yet.</div>')}
  if(tab==='rep'){const rs=S.reports.filter(r=>r.fam===f.id).sort((a,b)=>b.week-a.week);body=`<h2>${bi('Weekly reports','التقارير الأسبوعية')}</h2>`+(rs.map(reportCard).join('')||'<div class="card mut">The first report will appear after the first week. · أول تقرير هيظهر بعد أول أسبوع.</div>')}
  if(tab==='learn'){body=`<h2>${esc(f.student)} · ${yName(f.year)}</h2>${PLANS[f.year]?courseProgress(f):''}<p class="mut">Current week: <b>${weekLabel(CUR[f.year].weeks[f.week])}</b></p>${weekBox(f.year,f.week,true)}<details class="wk"><summary><span>All weeks</span></summary><div class="body">${CUR[f.year].weeks.map((w,i)=>weekBox(f.year,i,false)).join('')}</div></details>`}
  if(tab==='msg'){const th=[[`fam:${f.id}`,'Educate Me Up team'],...[...new Set(my.filter(s=>s.teacher).map(s=>s.teacher))].map(t=>[`tf:${t}:${f.id}`,'Teacher – '+short(tch(t).name)])];body=chatView(th,'parent')}
  return tabsHtml(tabs)+body}

function hwWeeks(f){const ws=CUR[f.year].weeks;const out=[];for(let i=0;i<=Math.min(f.week,ws.length-1);i++){const h=ws[i].mats.filter(m=>m.k==='hw');const seen=new Set();out.push({i,w:ws[i],tasks:h.filter(m=>!seen.has(m.u)&&seen.add(m.u))})}return out.reverse()}
function hwOf(fid,wi){return S.hw.find(h=>h.fam===fid&&h.week===wi)}
function hwStatus(h){if(!h)return'<span class="pill s-can">Not submitted · لم يُسلَّم</span>';if(h.status==='submitted')return'<span class="pill s-pay">Submitted – being marked · قيد التصحيح</span>';return`<span class="pill s-paid">Marked · ${h.mark} / ${h.total}</span>`}
const LEVELS=['Excellent · ممتاز','Very good · جيد جدًا','Good · جيد','Needs support · محتاج دعم'];
function reportCard(r){const f=fam(r.fam);return `<div class="card" style="margin-bottom:12px;border-left:5px solid var(--gold)"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${weekLabel(CUR[f.year].weeks[r.week])}</h3><span class="pill s-sch">${esc(r.level)}</span></div>
  <div class="grid g2" style="margin-top:10px"><div><div class="mut small">Attendance · الحضور</div><b>${esc(r.att)}</b></div><div><div class="mut small">Homework · الواجب</div><b>${esc(r.hwst)}</b></div></div>
  <div style="margin-top:10px"><div class="mut small">Strengths · نقاط القوة</div>${esc(r.good)}</div>
  <div style="margin-top:8px"><div class="mut small">To improve · محتاج يتحسن في</div>${esc(r.improve)}</div>
  <div style="margin-top:8px"><div class="mut small">Teacher’s comment · تعليق المدرس</div>${esc(r.comment)}</div>
  <div class="mut small" style="margin-top:8px">${esc(short(tch(r.teacher).name))} · ${fmt(r.at)}</div></div>`}

/* ---------- TEACHER ---------- */
function myFams(){return [...new Set(S.sessions.filter(s=>s.teacher===S.me.teacher).map(s=>s.fam))]}
function viewTeacher(){
  const t=tch(S.me.teacher);const my=S.sessions.filter(s=>s.teacher===t.id);
  tab=tab||'today';
  const tabs=[['today','My sessions'],['hw','Homework to mark'+(S.hw.filter(h=>h.status==='submitted'&&myFams().includes(h.fam)).length?' ('+S.hw.filter(h=>h.status==='submitted'&&myFams().includes(h.fam)).length+')':'')],['rep','Weekly reports'],['students','My students'],['plans','📋 Lesson plans'],['library','Curriculum library'],['msg','Messages'],['earn','My sessions & earnings']];
  let body='';
  if(tab==='today'){const up=my.filter(s=>s.status==='scheduled').sort((a,b)=>new Date(a.when)-new Date(b.when));
    body=`<div class="card row" style="margin-bottom:12px;justify-content:space-between"><div><b>⚡ Flying Sessions</b><div class="mut small">Turn this on when you can take an urgent session at short notice.</div></div><button class="btn ${t.avail?'green':'ghost'}" data-avail>${t.avail?'🟢 Available now':'Not available'}</button></div><div class="notice" style="margin-bottom:14px">Join every session from here using <b>Start session</b>. Family contact details are not shared with teachers – please use platform messages only.</div>
    ${up.length?up.map(s=>sessCard(s,'teacher')).join(''):'<div class="card mut">No scheduled sessions.</div>'}`}
  if(tab==='hw'){const subs=S.hw.filter(h=>myFams().includes(h.fam)).sort((a,b)=>(a.status==='submitted'?0:1)-(b.status==='submitted'?0:1));
    body=`<div class="card"><table><tr><th>Student</th><th>Week</th><th>Files</th><th>Status</th><th></th></tr>${subs.map(h=>{const f=fam(h.fam);return `<tr><td><b>${esc(short(f.student))}</b><div class="mut small">${yName(f.year)}</div></td><td>${weekLabel(CUR[f.year].weeks[h.week])}</td><td class="small">${h.files.map(esc).join('<br>')}</td><td>${hwStatus(h)}</td><td class="right"><button class="btn ${h.status==='submitted'?'gold':'ghost'}" data-mark="${h.id}">${h.status==='submitted'?'Mark':'Edit'}</button></td></tr>`}).join('')||'<tr><td class="mut">Nothing to mark.</td></tr>'}</table></div>`}
  if(tab==='rep'){const fams=myFams().map(fam);body=`<div class="notice" style="margin-bottom:14px">Write one report per student every week – parents see it in their account.</div><div class="grid g2">${fams.map(f=>{const last=S.reports.filter(r=>r.fam===f.id).sort((a,b)=>b.week-a.week)[0];return `<div class="card"><h3>${esc(short(f.student))}</h3><div class="mut small">${yName(f.year)} · current: ${weekLabel(CUR[f.year].weeks[f.week])}</div><p class="small">Last report: ${last?weekLabel(CUR[f.year].weeks[last.week]):'none yet'}</p><button class="btn gold" data-rep="${f.id}">Write weekly report</button></div>`}).join('')}</div>`}
  if(tab==='students'){const fams=[...new Set(my.map(s=>s.fam))].map(fam);
    body=`<div class="grid g2">${fams.map(f=>`<div class="card"><h3>${esc(short(f.student))}</h3><div class="mut small">${yName(f.year)} · ${f.type==='group'?'Group':'Private'}</div><p>Current week: <b>${weekLabel(CUR[f.year].weeks[f.week])}</b></p><span class="lock">🔒 Parent contact handled by the coordinator</span><div style="margin-top:10px">${weekBox(f.year,f.week,false)}</div></div>`).join('')||'<div class="card mut">No students yet.</div>'}</div>`}
  if(tab==='plans'){body=plansView(t)}
  if(tab==='library'){window._ly=window._ly||t.years[0];
    body=`<div class="row" style="margin-bottom:12px">${PROGS.map(y=>`<button class="btn ${y===window._ly?'':'ghost'}" data-ly="${y}">${yName(y)}</button>`).join('')}</div>${CUR[window._ly].weeks.length?CUR[window._ly].weeks.map((w,i)=>weekBox(window._ly,i,false)).join(''):'<div class="card mut">Materials for this programme are being prepared.</div>'}
    ${CUR[window._ly].extra.map(x=>`<details class="wk"><summary><span>${esc(x.name)}</span></summary><div class="body">${x.mats.map(m=>`<a class="mat" href="${m.u}" target="_blank"><span class="ic i-study">S</span>${esc(m.t)}</a>`).join('')}</div></details>`).join('')}`}
  if(tab==='msg'){const fams=[...new Set(my.map(s=>s.fam))];body=chatView([[`staff:${t.id}`,'Coordinator'],...fams.map(f=>[`tf:${t.id}:${f}`,'Family of '+short(fam(f).student)])],'teacher')}
  if(tab==='earn'){body=earnView(t)}
  return tabsHtml(tabs)+body}

function sessCard(s,as){const f=fam(s.fam),dd=day(s.when),w=CUR[f.year].weeks[s.week];const can=joinable(s);
  const who=(as==='teacher'?`${esc(short(f.student))} · ${yName(f.year)} · ${f.type==='group'?'Group':'Private'}`:`${esc(f.student)} with ${esc(short(tch(s.teacher).name))}`)+(s.flying?'<span class="flytag">⚡ Flying</span>':'');
  return `<div class="sess"><div class="when"><b>${dd.d}</b>${dd.m}<div class="small">${dd.t}</div></div><div class="grow"><b>${who}</b><div class="mut small">${s.flying?'Urgent help'+(s.topic?': <b>'+esc(s.topic)+'</b>':''):(w?weekLabel(w):'')} · 60–75 min · Google Meet</div>
   ${as==='teacher'?`<div class="row small" style="margin-top:6px"><a href="#" data-prep="${s.id}">Open this week's materials</a>${PLANS[f.year]?` · <a href="#" data-openplan="${f.year}:${(s.lesson??f.lesson??0)}">📋 Open the lesson plan (Session ${(s.lesson??f.lesson??0)+1})</a>`:''}</div>`:''}</div>
   <div class="row">${can?`<a class="btn green" href="${s.meet}" target="_blank" rel="noopener">${as==='teacher'?'Start session':'Join session'}</a>`:`<button class="btn" disabled title="Opens 15 minutes before">Join opens 15 min before</button>`}
   ${as==='teacher'?`<button class="btn ghost" data-finish="${s.id}">Mark done</button>`:''}</div></div>`}

/* ---------- ADMIN ---------- */
function viewAdmin(){
  tab=tab||(S.flying.some(x=>x.status==='new')?'fly':'pipe');
  const flagged=S.messages.filter(m=>m.blocked).length;
  const tabs=[['fly','⚡ Flying'+(S.flying.filter(x=>x.status==='new').length?' ('+S.flying.filter(x=>x.status==='new').length+')':'')],['pipe','Bookings'],['fol','Follow-up'],['fam','Students & families'],['tch','Teachers'],['log','📊 Sessions count'],['fin','Finance'],['msg','Messages'+(flagged?' ⚠'+flagged:'')]];
  let body='';
  if(tab==='pipe'){const order=['pending','paid','scheduled','done'];
    body=`<div class="row" style="margin-bottom:14px"><button class="btn gold" data-newbk>+ New booking</button><span class="mut small">Use this after agreeing the time and price with the parent on WhatsApp.</span></div><div class="grid g4" style="margin-bottom:16px">${order.map(o=>`<div class="card stat"><div class="mut small">${ST[o][0]}</div><div class="n">${S.sessions.filter(s=>s.status===o).length}</div></div>`).join('')}</div>
    <div class="card"><table><tr><th>Student</th><th>Programme</th><th>Status</th><th>Teacher</th><th>Time</th><th>Payment</th><th></th></tr>
    ${S.sessions.slice().sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status)).map(s=>{const f=fam(s.fam);return `<tr><td><b>${esc(f.student)}</b><div class="mut small">${f.type}</div></td><td>${({gen:'General',am:'American'})[f.year]||'Year '+f.year}</td><td>${pill(s.status)}${s.flying?'<span class="flytag">⚡</span>':''}</td><td>${s.teacher?esc(tch(s.teacher).name):'—'}</td><td>${fmt(s.when)}</td><td>${money(s.price,s.cur)} ${['pending','paid'].includes(s.status)?`<a href="#" class="small" data-price="${s.id}">edit</a>`:''}<div class="mut small">${esc(s.payRef||'not paid')}</div></td>
     <td class="right">${s.status==='pending'?`<button class="btn gold" data-confirm="${s.id}">Confirm payment</button>`:''}${s.status==='paid'?`<button class="btn" data-sched="${s.id}">Assign & schedule</button>`:''}${s.status==='scheduled'?`<button class="btn ghost" data-sched="${s.id}">Edit</button>`:''}</td></tr>`}).join('')}</table></div>`}
  if(tab==='req'){body=`<div class="card"><table><tr><th>Received</th><th>Parent</th><th>Student</th><th>Year / type</th><th>Times</th><th></th></tr>${S.requests.map(r=>`<tr><td>${fmt(r.at)}</td><td>${esc(r.parent)}<div class="small">${esc(r.phone)}</div><div class="mut small">${esc(r.country||'Egypt')}</div></td><td>${esc(r.student)}<div class="mut small">${esc(r.notes)}</div></td><td>${r.year} · ${r.type}</td><td>${esc(r.times)}</td><td class="right">${r.status==='new'?`<button class="btn gold" data-accept="${r.id}">Contacted → create booking</button>`:'<span class="pill s-done">Booking created</span>'}</td></tr>`).join('')||'<tr><td class="mut">No requests.</td></tr>'}</table></div>
    <p class="mut small">Your team contacts the parent on WhatsApp, sends the InstaPay details, then creates the booking here. Teachers never see these numbers.</p>`}
  if(tab==='fly'){const av=S.teachers.filter(x=>x.avail);const mins=d=>Math.round((Date.now()-new Date(d))/60000);
    body=`<div class="notice" style="margin-bottom:14px"><b>Teachers available now:</b> ${av.length?av.map(x=>'🟢 '+esc(x.name)).join(' · '):'none – call a teacher'} </div>
    <div class="card"><table><tr><th>Waiting</th><th>Contact</th><th>Student / level</th><th>Needs help with</th><th>How soon</th><th></th></tr>${S.flying.slice().sort((a,b)=>(a.status==='new'?0:1)-(b.status==='new'?0:1)).map(x=>`<tr><td>${x.status==='new'?`<span class="flag">${mins(x.at)} min</span>`:'<span class="pill s-done">Booked</span>'}</td><td>${esc(x.parent)}<div class="small">${esc(x.phone)}</div></td><td>${esc(x.student)}<div class="mut small">${x.level==='other'?'Other':CUR[x.level].name}</div></td><td>${esc(x.topic)}<div class="mut small">${esc(x.notes||'')}</div></td><td>${esc(x.need)}</td><td class="right">${x.status==='new'?`<button class="btn gold" data-flybook="${x.id}">⚡ Book now</button>`:''}</td></tr>`).join('')||'<tr><td class="mut">No requests.</td></tr>'}</table></div>
    <p class="mut small">Call the parent on the academy WhatsApp, agree the price, then press “Book now” – the teacher and parent get it instantly on the platform.</p>`}
  if(tab==='fol'){body=`<div class="card"><table><tr><th>Student</th><th>Teacher</th><th>Current week</th><th>Homework (this week)</th><th>Last report</th></tr>${S.families.map(f=>{const s=S.sessions.filter(x=>x.fam===f.id&&x.teacher).slice(-1)[0];const h=hwOf(f.id,f.week);const r=S.reports.filter(x=>x.fam===f.id).sort((a,b)=>b.week-a.week)[0];return `<tr><td><b>${esc(f.student)}</b><div class="mut small">${yName(f.year)}</div></td><td>${s?esc(tch(s.teacher).name):'—'}</td><td>${weekLabel(CUR[f.year].weeks[f.week])}</td><td>${hwStatus(h)}</td><td>${r?weekLabel(CUR[f.year].weeks[r.week])+'<div class="mut small">'+esc(r.level)+'</div>':'<span class="flag">No report yet</span>'}</td></tr>`}).join('')}</table></div>`}
  if(tab==='fam'){body=`<div class="card"><table><tr><th>Student</th><th>Year</th><th>Parent</th><th>Contact (coordinator only)</th><th>Current week</th><th>Sessions</th><th>Login</th></tr>${S.families.map(f=>`<tr><td><b>${esc(f.student)}</b><div class="mut small">${f.type}</div></td><td>${yName(f.year)}</td><td>${esc(f.parent)}</td><td>${esc(f.phone)}<div class="mut small">${esc(f.email)} ${esc(f.country||'Egypt')}</div></td><td><select data-week="${f.id}">${CUR[f.year].weeks.map((w,i)=>`<option value="${i}" ${i===f.week?'selected':''}>${weekLabel(w)}</option>`).join('')}</select></td><td>${S.sessions.filter(s=>s.fam===f.id&&s.status==='done').length} done</td><td><button class="btn ghost" data-login="parent:${f.id}">🔑 Login</button></td></tr>`).join('')||'<tr><td class="mut">No students yet.</td></tr>'}</table></div>`}
  if(tab==='tch'){body=`<div class="card"><table><tr><th>Teacher</th><th>Years</th><th>Rate / session</th><th>Done</th><th>Due</th><th>Login</th></tr>${S.teachers.map(t=>{const d=S.sessions.filter(s=>s.teacher===t.id&&s.status==='done').length;return `<tr><td><b>${esc(t.name)}</b></td><td>${t.years.join(', ')}</td><td><select data-rate="${t.id}">${[200,250,300].map(r=>`<option ${r===t.rate?'selected':''} value="${r}">${money(r)}</option>`).join('')}</select></td><td>${d}</td><td>${money(d*t.rate)}</td><td><button class="btn ghost" data-login="teacher:${t.id}">🔑 Login</button></td></tr>`}).join('')||'<tr><td class="mut">No teachers yet.</td></tr>'}</table><div style="margin-top:12px"><button class="btn gold" id="addT">+ Add teacher</button></div></div>`}
  if(tab==='log'){body=logView()}
  if(tab==='fin'){const done=S.sessions.filter(s=>s.status==='done');const paid=S.sessions.filter(s=>['paid','scheduled','done'].includes(s.status));const rev=paid.filter(s=>!s.cur||s.cur==='EGP').reduce((a,s)=>a+s.price,0);const pay=done.reduce((a,s)=>a+tch(s.teacher).rate,0);
    body=`<div class="grid g4"><div class="card stat"><div class="mut small">Payments received</div><div class="n">${money(rev)}</div></div><div class="card stat"><div class="mut small">Sessions completed</div><div class="n">${done.length}</div></div><div class="card stat"><div class="mut small">Teacher pay due</div><div class="n">${money(pay)}</div></div><div class="card stat"><div class="mut small">Net (completed sessions)</div><div class="n">${money(done.filter(s=>!s.cur||s.cur==='EGP').reduce((a,s)=>a+s.price,0)-pay)}</div></div></div>
    <div class="card" style="margin-top:14px"><h3>Teacher payouts</h3><table><tr><th>Teacher</th><th>Sessions</th><th>Rate</th><th class="right">Due</th></tr>${S.teachers.map(t=>{const d=done.filter(s=>s.teacher===t.id).length;return `<tr><td>${esc(t.name)}</td><td>${d}</td><td>${money(t.rate)}</td><td class="right">${money(d*t.rate)}</td></tr>`}).join('')}</table></div>`}
  if(tab==='msg'){const ths=[...new Set(S.messages.map(m=>m.thread))];body=`<p class="mut small">The coordinator sees every conversation. Messages containing phone numbers, emails, links or social-media names are blocked automatically and flagged here.</p>`+chatView(ths.map(t=>[t,threadName(t)]),'admin')}
  return tabsHtml(tabs)+body}
function threadName(t){const p=t.split(':');if(p[0]==='fam')return'Team ↔ '+fam(p[1]).parent;if(p[0]==='staff')return'Team ↔ '+tch(p[1]).name;if(p[0]==='tf')return tch(p[1]).name+' ↔ '+fam(p[2]).parent;return t}

/* ---------- chat ---------- */
function chatView(threads,as){thread=thread&&threads.find(t=>t[0]===thread)?thread:(threads[0]||[])[0];
  const ms=S.messages.filter(m=>m.thread===thread);
  const meKey={parent:'parent',teacher:'teacher',admin:'admin'}[as];
  const label=m=>({admin:'Educate Me Up team',teacher:as==='parent'?'Teacher':(as==='admin'?tch(thread.split(':')[1])?.name||'Teacher':'You'),parent:as==='teacher'?'Parent':(as==='admin'?'Parent':'You')}[m.from]);
  return `<div class="chat"><div class="threads">${threads.map(([id,n])=>{const fl=S.messages.some(m=>m.thread===id&&m.blocked);return `<div class="${id===thread?'on':''}" data-thread="${id}">${esc(n)}${as==='admin'&&fl?' <span class="flag">⚠</span>':''}</div>`}).join('')}</div>
   <div class="msgs"><div class="msglist">${ms.map(m=>{const mine=m.from===meKey;if(m.blocked&&as!=='admin'&&!mine)return'';return `<div class="m ${m.blocked?'blocked':mine?'me':'them'}">${m.blocked&&as!=='admin'?'This message was not sent: contact details can’t be shared on Educate Me Up.':esc(m.text)}${m.blocked&&as==='admin'?'<div class="flag small">Blocked – contact details</div>':''}<div class="meta">${label(m)} · ${fmt(m.at)}</div></div>`}).join('')||'<div class="mut">No messages yet.</div>'}</div>
   <form class="compose" id="compose"><input name="t" placeholder="Write a message…" autocomplete="off"><button class="btn">Send</button></form></div></div>`}

function tabsHtml(t){return `<div class="tabs">${t.map(([k,n])=>`<button class="${k===tab?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>`}

/* ---------- modals ---------- */
function modal(html){const l=document.getElementById('layer');l.innerHTML=`<div class="modal"><div class="card">${html}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="mClose">Close</button></div></div></div>`;document.getElementById('mClose').onclick=()=>l.innerHTML='';return l}
function closeModal(){document.getElementById('layer').innerHTML=''}
function schedModal(id){const s=S.sessions.find(x=>x.id===id),f=fam(s.fam);const tl=S.teachers.filter(t=>t.years.includes(f.year));

/* ---------- course progress, lesson plans, session counting ---------- */
function courseProgress(f){const P=PLANS[f.year],n=P.sessions.length,i=f.lesson||0,done=S.sessions.filter(s=>s.fam===f.id&&s.status==='done'&&!s.trial).length;
  return `<div class="card" style="margin:8px 0 14px"><div class="row" style="justify-content:space-between"><b>Course progress · تقدّم الكورس</b><span class="mut small">Next: Session ${i+1} of ${n} · Week ${P.sessions[i].week}</span></div>
  <div class="pbar"><i style="width:${Math.round(done/n*100)}%"></i></div><div class="mut small">${done} of ${n} sessions completed · ${esc(P.sessions[i].aim||'')}</div></div>`}
function bidi(t){return esc(t).replace(/([A-Za-z][A-Za-z0-9 ',.?!/-]*[A-Za-z0-9.?!])/g,'<bdi dir="ltr">$1</bdi>')}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function plansView(t){const progs=t.years.filter(y=>PLANS[y]);
  if(!progs.length)return '<div class="card mut">No lesson plans for your programmes yet.</div>';
  window._pp=progs.includes(window._pp)?window._pp:progs[0];const P=PLANS[window._pp];
  const head=`<div class="notice" style="margin-bottom:12px">🔒 <b>Teachers only.</b> Students and parents never see this page. Open the plan when you start the session and follow the steps — each session is planned for 60 minutes.</div>
  <div class="row" style="margin-bottom:12px">${progs.map(y=>`<button class="btn ${y===window._pp?'':'ghost'}" data-pprog="${y}">${esc(PLANS[y].name)}</button>`).join('')}</div>`;
  if(window._ps==null)return head+`<div class="card"><table><tr><th>#</th><th>Session</th><th>Aim</th><th></th></tr>${P.sessions.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.title)}</b></td><td class="small">${esc(x.aim)}</td><td class="right"><button class="btn gold" data-psess="${i}">Open plan</button></td></tr>`).join('')}</table></div>`;
  const x=P.sessions[window._ps],R=window._run&&window._run.key===window._pp+':'+window._ps?window._run:null;
  return head+`<div class="card plan"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><a href="#" data-psess="back">← All sessions</a><h2 style="margin:6px 0 2px">${esc(x.title)}</h2><div class="mut small">Aim: ${esc(x.aim)}</div>${x.link?`<div class="small"><a href="${x.link}" target="_blank" rel="noopener">Open the lesson page to share on screen ↗</a></div>`:''}</div>
   <div class="timer"><div class="clock" id="pclock">${R?fmtClock(runElapsed(R)):'00:00'}</div><div class="mut small">of 60:00</div><div class="row" style="justify-content:center;margin-top:6px">${R&&!R.paused?'<button class="btn ghost" data-ptimer="pause">Pause</button>':`<button class="btn green" data-ptimer="start">${R?'Resume':'▶ Start session timer'}</button>`}${R?'<button class="btn ghost" data-ptimer="reset">Reset</button>':''}</div></div></div>
   <div class="pbar" style="margin:12px 0"><i id="ppbar" style="width:${R?Math.min(100,runElapsed(R)/36):0}%"></i></div>
   ${x.steps.map((st,k)=>`<div class="pstep" data-from="${st.from}" data-to="${st.to}" id="pst${k}"><div class="pmin">${st.from}–${st.to}<span>min</span></div><div class="grow"><h3>${k+1}. ${esc(st.title)}</h3>
     <ul>${st.do.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>
     ${st.say?`<div class="psay"><b>Say:</b> ${st.say.map(esc).join(' · ')}</div>`:''}
     ${st.tip?`<div class="ptip ar" dir="rtl">${bidi(st.tip)}</div>`:''}
     ${st.content?`<details><summary>Content (${st.content.length})</summary><ol class="small">${st.content.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></details>`:''}
     ${st.answers?`<details><summary>Answers</summary><ol class="small">${st.answers.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></details>`:''}
   </div><label class="pchk"><input type="checkbox" data-pchk="${k}" ${R&&R.done&&R.done[k]?'checked':''}> Done</label></div>`).join('')}
   <div class="notice" style="margin-top:12px">At the end: click <b>Mark done</b> on the session in <b>My sessions</b> and write the short report for the family. The session is counted automatically.</div></div>`}
function runElapsed(R){return (R.elapsed||0)+(R.paused?0:(Date.now()-R.start)/1000)}
function tickPlan(){const R=window._run;const c=document.getElementById('pclock');if(!R||!c)return;const e=runElapsed(R);c.textContent=fmtClock(e);const b=document.getElementById('ppbar');if(b)b.style.width=Math.min(100,e/36)+'%';
  const m=e/60;document.querySelectorAll('.pstep').forEach(el=>{el.classList.toggle('now',m>=+el.dataset.from&&m<+el.dataset.to);el.classList.toggle('past',m>=+el.dataset.to)});
  if(e>=3600)c.classList.add('over')}
setInterval(tickPlan,1000);
function monthKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function monthName(k){const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function doneSessions(){return S.sessions.filter(s=>s.status==='done')}
function months(){const set=new Set(doneSessions().map(s=>monthKey(s.doneAt||s.when)));set.add(monthKey(new Date()));return [...set].sort().reverse()}
function monthSel(){window._mo=window._mo||monthKey(new Date());return `<span class="row" style="gap:8px;align-items:center"><b class="small">Month</b><select data-month style="width:auto">${months().map(m=>`<option value="${m}" ${m===window._mo?'selected':''}>${monthName(m)}</option>`).join('')}</select></span>`}
function lessonName(s){const f=fam(s.fam);if(s.flying)return '⚡ Flying session';if(s.trial)return 'Trial session';if(PLANS[f.year]&&s.lesson!=null)return 'Session '+(s.lesson+1)+' · Week '+PLANS[f.year].sessions[s.lesson].week;return weekLabel(CUR[f.year].weeks[s.week])}
function inMonth(s){return monthKey(s.doneAt||s.when)===window._mo}
function earnView(t){window._mo=window._mo||monthKey(new Date());const done=doneSessions().filter(s=>s.teacher===t.id&&inMonth(s)).sort((a,b)=>new Date(a.doneAt||a.when)-new Date(b.doneAt||b.when));
  return `<div class="row" style="margin-bottom:12px">${monthSel()}</div><div class="grid g3"><div class="card stat"><div class="mut small">Sessions completed</div><div class="n">${done.length}</div></div><div class="card stat"><div class="mut small">Rate per session</div><div class="n">${money(t.rate)}</div></div><div class="card stat"><div class="mut small">Due for ${monthName(window._mo)}</div><div class="n">${money(done.length*t.rate)}</div></div></div>
  <div class="card" style="margin-top:14px"><table><tr><th>#</th><th>Date</th><th>Student</th><th>Session</th><th class="right">Amount</th></tr>${done.map((s,i)=>`<tr><td>${i+1}</td><td>${fmt(s.doneAt||s.when)}</td><td>${esc(short(fam(s.fam).student))}</td><td>${lessonName(s)}</td><td class="right">${money(t.rate)}</td></tr>`).join('')||'<tr><td class="mut">No completed sessions this month.</td></tr>'}</table>
  <p class="mut small">A session is counted when you click <b>Mark done</b> and save the report. If a count looks wrong, message the coordinator.</p></div>`}
function logView(){window._mo=window._mo||monthKey(new Date());const done=doneSessions().filter(inMonth).sort((a,b)=>new Date(a.doneAt||a.when)-new Date(b.doneAt||b.when));
  const per=S.teachers.map(t=>{const d=done.filter(s=>s.teacher===t.id);return {t,d,pay:d.length*t.rate,studs:[...new Set(d.map(s=>s.fam))].length}});

  <div class="grid g4" style="margin-bottom:14px"><div class="card stat"><div class="mut small">Sessions this month</div><div class="n">${done.length}</div></div><div class="card stat"><div class="mut small">Teacher pay due</div><div class="n">${money(per.reduce((a,x)=>a+x.pay,0))}</div></div><div class="card stat"><div class="mut small">Trial sessions</div><div class="n">${done.filter(s=>s.trial).length}</div></div><div class="card stat"><div class="mut small">Flying sessions</div><div class="n">${done.filter(s=>s.flying).length}</div></div></div>
  <div class="card"><h3>Per teacher · ${monthName(window._mo)}</h3><table><tr><th>Teacher</th><th>Sessions</th><th>Students</th><th>Rate</th><th class="right">Due</th></tr>${per.map(x=>`<tr><td><b>${esc(x.t.name)}</b></td><td>${x.d.length}</td><td>${x.studs}</td><td>${money(x.t.rate)}</td><td class="right"><b>${money(x.pay)}</b></td></tr>`).join('')}</table></div>
  <div class="card" style="margin-top:14px"><h3>Every session</h3><table><tr><th>#</th><th>Date</th><th>Teacher</th><th>Student</th><th>Programme</th><th>Session</th><th>Paid</th></tr>${done.map((s,i)=>{const f=fam(s.fam);return `<tr><td>${i+1}</td><td>${fmt(s.doneAt||s.when)}</td><td>${esc(tch(s.teacher).name)}</td><td>${esc(f.student)}</td><td>${yName(f.year)}</td><td>${lessonName(s)}</td><td>${money(s.price,s.cur)}</td></tr>`}).join('')||'<tr><td class="mut">No completed sessions this month.</td></tr>'}</table>
  <p class="mut small">Sessions are counted automatically when the teacher clicks <b>Mark done</b>. The CSV opens in Excel, so the assistants sheet is no longer needed for teacher sessions.</p></div>`}
function downloadCsv(){const rows=[['Date','Teacher','Student','Programme','Session','Teacher rate (EGP)','Price paid','Currency']];
  doneSessions().filter(inMonth).forEach(s=>{const f=fam(s.fam);rows.push([new Date(s.doneAt||s.when).toLocaleString('en-GB'),tch(s.teacher).name,f.student,yName(f.year),lessonName(s),tch(s.teacher).rate,s.price,s.cur||'EGP'])});
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Educate Me Up – sessions – '+monthName(window._mo)+'.csv';a.click()}

/* ---------- events ---------- */
function bind(){

  document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.login.split(':');b.disabled=true;showLogin(k,id).finally(()=>b.disabled=false)});
  const at=document.getElementById('addT');if(at)at.onclick=()=>{const l=modal(`<h2>Add teacher</h2><label>Full name</label><input id="tN"><label>Phone (used to log in)</label><input id="tP" inputmode="tel" placeholder="01xxxxxxxxx">
    <label>Rate per session (EGP)</label><select id="tR">${[200,250,300].map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
    <label>Programmes</label><div class="grid g2">${PROGS.map(p=>`<label class="small" style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" value="${p}" style="width:auto" class="tY"> ${esc(CUR[p].name)}</label>`).join('')}</div>
    <div style="margin-top:12px"><button class="btn gold" id="tOk">Add teacher & create login</button></div>`);
    l.querySelector('#tOk').onclick=async()=>{const n=l.querySelector('#tN').value.trim(),ph=l.querySelector('#tP').value.trim(),ys=[...l.querySelectorAll('.tY:checked')].map(x=>x.value);if(!n||!phoneKey(ph)||!ys.length){toast('Name, phone and at least one programme');return}
      const id='t'+Date.now();S.teachers.push({id,name:n,phone:phoneKey(ph),rate:+l.querySelector('#tR').value,years:ys,avail:false});save();closeModal();render();setTimeout(()=>showLogin('teacher',id),500)}};

  document.querySelectorAll('[data-pprog]').forEach(b=>b.onclick=()=>{window._pp=b.dataset.pprog;window._ps=null;render()});
  document.querySelectorAll('[data-psess]').forEach(b=>b.onclick=e=>{e.preventDefault();window._ps=b.dataset.psess==='back'?null:+b.dataset.psess;render();scrollTo(0,0)});
  document.querySelectorAll('[data-openplan]').forEach(b=>b.onclick=e=>{e.preventDefault();const [y,i]=b.dataset.openplan.split(':');window._pp=y;window._ps=+i;tab='plans';render();scrollTo(0,0)});
  document.querySelectorAll('[data-ptimer]').forEach(b=>b.onclick=()=>{const key=window._pp+':'+window._ps,a=b.dataset.ptimer;let R=window._run&&window._run.key===key?window._run:null;
    if(a==='start'){if(!R)R=window._run={key,elapsed:0,done:{}};R.start=Date.now();R.paused=false}
    if(a==='pause'&&R){R.elapsed=runElapsed(R);R.paused=true}
    if(a==='reset')window._run=null;render();tickPlan()});
  document.querySelectorAll('[data-pchk]').forEach(b=>b.onchange=()=>{const key=window._pp+':'+window._ps;if(!window._run||window._run.key!==key)window._run={key,elapsed:0,paused:true,done:{}};window._run.done[b.dataset.pchk]=b.checked;b.closest('.pstep').classList.toggle('ticked',b.checked)});
  document.querySelectorAll('[data-month]').forEach(b=>b.onchange=()=>{window._mo=b.value;render()});
  document.querySelectorAll('[data-csv]').forEach(b=>b.onclick=downloadCsv);
  tickPlan();
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;thread=null;render()});
  document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{thread=b.dataset.thread;render()});
  document.querySelectorAll('[data-ly]').forEach(b=>b.onclick=()=>{window._ly=b.dataset.ly;render()});
  const gb=document.getElementById('goBook');if(gb)gb.onclick=()=>document.getElementById('bookCard').scrollIntoView({behavior:'smooth'});
  const bf=document.getElementById('bookForm');if(bf){
    bf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(bf));S.requests.unshift({id:'r'+Date.now(),...d,at:new Date().toISOString(),status:'new'});save();bf.outerHTML='<div class="ok"><b>Request received.</b> Our team will contact you on WhatsApp with the price, the available times and the InstaPay details.</div>'}}
  document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{const s=S.sessions.find(x=>x.id===b.dataset.confirm);s.status=(s.teacher&&s.when)?'scheduled':'paid';s.payRef=s.payRef||'InstaPay – confirmed';save();render();toast('Payment confirmed')});
  document.querySelectorAll('[data-sched]').forEach(b=>b.onclick=()=>schedModal(b.dataset.sched));
  document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>finishModal(b.dataset.finish));
  document.querySelectorAll('[data-prep]').forEach(b=>b.onclick=e=>{e.preventDefault();const s=S.sessions.find(x=>x.id===b.dataset.prep),f=fam(s.fam);modal(`<h2>${esc(short(f.student))} – lesson materials</h2>${weekBox(f.year,s.week,true)}`)});
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const s=S.sessions.find(x=>x.id===b.dataset.pay);const l=modal(`<h2>I have paid · دفعت</h2><p class="mut">Amount: <b>${money(s.price,s.cur)}</b> by InstaPay to ${INSTAPAY}</p><label>InstaPay reference number or the sender's name · رقم العملية أو اسم المحوِّل</label><input id="rc"><p class="mut small">Please also send the transfer screenshot on the academy WhatsApp. · وابعت صورة التحويل على واتساب الأكاديمية.</p><div style="margin-top:12px"><button class="btn gold" id="rcOk">Send to the team</button></div>`);l.querySelector('#rcOk').onclick=()=>{const v=l.querySelector('#rc').value.trim();if(!v){toast('Write the reference or the sender name');return}s.payRef='Paid: '+v;save();closeModal();render();toast('Sent – the team will confirm and schedule')}});
  document.querySelectorAll('[data-newbook]').forEach(b=>b.onclick=()=>{const f=fam(S.me.parent);S.sessions.push({id:'s'+Date.now(),fam:f.id,status:'pending',price:PRICE[f.year],cur:'EGP',teacher:null,when:null,meet:'',week:f.week,payRef:''});save();render();toast('Booking created – please pay to confirm')});
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptModal(b.dataset.accept));
  document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>priceModal(b.dataset.price));
  document.querySelectorAll('[data-newbk]').forEach(b=>b.onclick=newBookingModal);
  document.querySelectorAll('[data-flybook]').forEach(b=>b.onclick=()=>{const x=S.flying.find(y=>y.id===b.dataset.flybook);newBookingModal({flying:true,fid:x.id,parent:x.parent,phone:x.phone,student:x.student,level:x.level==='other'?'gen':x.level,topic:x.topic})});
  document.querySelectorAll('[data-avail]').forEach(b=>b.onclick=()=>{const tt=tch(S.me.teacher);tt.avail=!tt.avail;save();render()});
  document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.goto).scrollIntoView({behavior:'smooth'})});
  document.querySelectorAll('[data-flyp]').forEach(b=>b.onclick=()=>{const f=fam(S.me.parent);const l=modal(`<h2>⚡ Flying Session</h2>${flyForm({parent:f.parent,phone:f.phone,student:f.student,level:f.year})}`);bindFly(l.querySelector('#flyForm'),true)});
  const ff=document.getElementById('flyForm');if(ff)bindFly(ff,false);
  document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>markModal(b.dataset.mark));
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>repModal(b.dataset.rep));
  document.querySelectorAll('[data-hwup]').forEach(b=>b.onclick=()=>{const wi=+b.dataset.hwup;const f=fam(S.me.parent);const h=hwOf(f.id,wi);if(h){h.status='submitted';h.at=new Date().toISOString();h.files=['Google Classroom']}else S.hw.push({id:'h'+Date.now(),fam:f.id,week:wi,files:['Google Classroom'],status:'submitted',at:new Date().toISOString()});save();render();toast('Thank you – the teacher will mark it')});
  document.querySelectorAll('[data-week]').forEach(sel=>sel.onchange=()=>{fam(sel.dataset.week).week=+sel.value;save();toast('Week updated')});
  document.querySelectorAll('[data-rate]').forEach(sel=>sel.onchange=()=>{tch(sel.dataset.rate).rate=+sel.value;save();render()});
  const c=document.getElementById('compose');if(c)c.onsubmit=e=>{e.preventDefault();const t=c.t.value.trim();if(!t||!thread)return;const from={parent:'parent',teacher:'teacher',admin:'admin'}[role];const bl=role!=='admin'&&contactLeak(t);
    S.messages.push({id:'m'+Date.now(),thread,from,text:t,at:new Date().toISOString(),blocked:bl});save();render();if(bl)toast('Blocked: phone numbers, emails, links and social apps can’t be shared')};
  document.querySelectorAll('table').forEach(tb=>{const hs=[...tb.querySelectorAll('th')].map(h=>h.textContent.trim());tb.querySelectorAll('tr').forEach(r=>[...r.children].forEach((c,i)=>{if(c.tagName==='TD'&&hs[i])c.dataset.label=hs[i]}))});
  const ml=document.querySelector('.msglist');if(ml)ml.scrollTop=ml.scrollHeight;
}
render();
</script>
</body>
</html>
