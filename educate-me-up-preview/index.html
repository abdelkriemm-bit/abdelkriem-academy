<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educate Me Up – Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a4a;--navy2:#1d4e89;--gold:#f5c542;--bg:#f6f7fb;--card:#fff;--line:#e3e8f0;--txt:#1d2433;--mut:#64708a;--green:#1e9e6a;--red:#d64545;--amber:#b7791f;--teal:#12a5a0;--coral:#ff7a59}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Cairo,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.ar{font-family:Cairo,sans-serif;direction:rtl}
a{color:var(--navy2)}
button{font-family:inherit;cursor:pointer}
.demo{background:#111827;color:#cbd5e1;display:flex;gap:6px;align-items:center;padding:7px 14px;flex-wrap:wrap;font-size:12px}
.demo b{color:#fff;margin-right:6px}
.demo button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:20px;padding:5px 12px;font-size:12px}
.demo button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.demo .reset{margin-left:auto;background:transparent;border-color:#4b5563}
.top{background:var(--navy);border-bottom:4px solid var(--gold);color:#fff;display:flex;align-items:center;padding:12px 22px;gap:14px}
.logo{font-weight:800;font-size:22px;letter-spacing:.2px}
.logo span{color:var(--gold)}
.top .who{margin-left:auto;font-size:13px;opacity:.9}
.wrap{max-width:1150px;margin:0 auto;padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:850px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(15,42,74,.05)}
h1,h2,h3{margin:0 0 10px;color:var(--navy)}
h2{font-size:19px}h3{font-size:15px}
.mut{color:var(--mut)}
.small{font-size:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:9px 16px;font-weight:600;font-size:13px}
.btn.gold{background:var(--gold);color:#111}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:8px 0 4px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.s-new{background:#e8eefb;color:#2b4fa8}.s-pay{background:#fff3d6;color:#9a6a00}.s-paid{background:#e3f4ea;color:var(--green)}
.s-sch{background:#e6f0ff;color:#174ea6}.s-done{background:#eceff3;color:#4b5563}.s-can{background:#fde8e6;color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat .n{font-size:24px;font-weight:800;color:var(--navy)}
.hero{background:radial-gradient(circle at 88% 12%,rgba(245,197,66,.35),transparent 38%),radial-gradient(circle at 5% 95%,rgba(18,165,160,.35),transparent 35%),linear-gradient(135deg,#0f2a4a,#1d4e89);color:#fff;border-radius:18px;padding:38px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero h1{color:#fff;font-size:36px;line-height:1.15}
.hero h1 span{color:var(--gold)}
.hero p{opacity:.9;line-height:1.7}
@media(max-width:850px){.hero{grid-template-columns:1fr;padding:24px}.hero h1{font-size:26px}}
.price{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:16px}
.price .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.price .row:last-child{border:0}
.price b{color:var(--gold)}
.yr{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.yr .tag{font-size:11px;color:var(--mut);font-weight:600}
.steps{counter-reset:s}
.steps div{counter-increment:s;padding:10px 0 10px 40px;position:relative}
.steps div:before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#111;font-weight:800;text-align:center;line-height:28px}
.notice{background:#fff8e6;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;font-size:13px}
.ok{background:#eef8f2;border:1px solid #bfe3cd;border-radius:10px;padding:10px 14px;font-size:13px}
.sess{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
.sess .when{min-width:96px;text-align:center;background:var(--bg);border-radius:10px;padding:8px}
.sess .when b{display:block;font-size:18px;color:var(--navy)}
.sess .grow{flex:1}
.wk{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.wk summary{padding:12px 14px;font-weight:600;cursor:pointer;color:var(--navy);display:flex;justify-content:space-between}
.wk .body{padding:0 14px 14px}
.cat{margin-top:10px}
.cat h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.mat{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--txt);font-size:13px}
.mat:hover{background:var(--bg)}
.ic{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.i-plan{background:#2b4fa8}.i-study{background:#0f766e}.i-quiz{background:#7c3aed}.i-hw{background:#c2410c}.i-practice{background:#be185d}
.chat{display:grid;grid-template-columns:240px 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-height:420px}
@media(max-width:850px){.chat{grid-template-columns:1fr}}
.threads{border-right:1px solid var(--line);background:#fafbfd}
.threads div{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.threads div.on{background:#fff;border-left:4px solid var(--gold)}
.msgs{display:flex;flex-direction:column}
.msglist{flex:1;padding:14px;overflow:auto;max-height:420px}
.m{max-width:75%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.5}
.m .meta{font-size:10px;color:var(--mut);margin-top:3px}
.m.me{margin-left:auto;background:var(--navy);color:#fff}.m.me .meta{color:#cbd5e1}
.m.them{background:var(--bg)}
.m.blocked{background:#fde8e6;color:var(--red);border:1px dashed var(--red)}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:13px}
.flag{color:var(--red);font-weight:700}
.right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock{font-size:12px;color:var(--mut);background:var(--bg);border-radius:8px;padding:6px 10px;display:inline-block}
@media(max-width:850px){.sess{flex-wrap:wrap}.sess .grow{min-width:60%}.sess .row{width:100%}.top{flex-wrap:wrap}.top .who{margin-left:0;width:100%}}
.memes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:850px){.memes{grid-template-columns:1fr 1fr}.meme .pic{font-size:34px;white-space:nowrap}.meme .cap{font-size:15px}}
.meme{border-radius:16px;padding:16px;color:var(--txt);background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--gold));box-shadow:0 2px 8px rgba(15,42,74,.05)}
.meme .pic{font-size:54px;line-height:1;margin:6px 0 10px}
.meme .cap{font-weight:700;font-size:15px;line-height:1.35}
.meme .sub{font-size:12px;margin-top:6px;opacity:.8}
.prog{border-radius:16px;padding:18px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--c);position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(15,42,74,.05)}
.prog h3{color:var(--navy);font-size:17px}
.prog .tag{display:inline-block;background:var(--bg);color:var(--c);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:8px}
.prog .em{position:absolute;right:12px;bottom:6px;font-size:40px}
.prog p{font-size:13px;color:var(--mut);margin:6px 0 4px}
.prog .ar{font-size:13px;color:var(--mut);margin:0 0 34px;text-align:right}
.bi .ar{display:block;color:var(--mut);font-size:13px;margin-top:2px;text-align:right}
.price .bi .ar,.hero .bi .ar{color:rgba(255,255,255,.8)}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat .fi{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:12px 18px}
.copybox{background:#f3f6fb;border:1px dashed #9db3d6;border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap;font-family:Cairo,Poppins,sans-serif}
.fly{background:linear-gradient(135deg,#fff4d6,#ffe1d6);border:2px solid var(--gold);border-radius:18px;padding:22px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media(max-width:850px){.fly{grid-template-columns:1fr}}
.fly h2{font-size:24px}
.bolt{display:inline-block;background:var(--navy);color:var(--gold);border-radius:12px;padding:4px 10px;font-weight:800;font-size:12px;letter-spacing:.5px}
.flytag{display:inline-block;background:#fff4d6;color:#9a6a00;border:1px solid var(--gold);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px}
.footer{text-align:center;color:var(--mut);font-size:12px;padding:30px}

/* ---- mobile ---- */
img,input,select,textarea{max-width:100%}
input[type=file]{width:100%;font-size:12px}
.mat{overflow-wrap:anywhere;word-break:break-word}
.card,.sess,.wk,.prog,.meme{min-width:0}
.grid>*{min-width:0}
@media(max-width:700px){
  .wrap{padding:14px}
  .demo{padding:6px 10px;gap:4px}.demo b{display:none}.demo button{padding:4px 9px;font-size:11px}.demo .reset{margin-left:0}
  .top{padding:10px 14px;gap:4px}.logo{font-size:20px}.top .small{display:none}.top .who{font-size:12px}
  .hero{padding:20px;border-radius:14px}.hero h1{font-size:26px}
  .hero .wa,.hero .btn{display:flex;justify-content:center;margin:8px 0 0!important;width:100%}
  .price .row{flex-direction:row;gap:10px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .tabs button{white-space:nowrap;flex:none;padding:7px 12px;font-size:13px}
  table,tbody,tr,td{display:block;width:100%}
  tr:has(th){display:none}
  tr{border:1px solid var(--line);border-radius:12px;padding:8px 6px;margin-bottom:10px;background:#fff}
  tr:nth-child(even) td{background:transparent}
  td{border:0;padding:3px 8px}
  td.right{text-align:left;padding-top:8px}
  td .btn{width:100%}
  td[data-label]:not([data-label=''])::before{content:attr(data-label);display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  .card>table{margin:0}
  .sess{flex-wrap:wrap;padding:12px}
  .sess .when{min-width:72px}
  .sess .row{width:100%}.sess .row .btn{flex:1;text-align:center}
  .chat{grid-template-columns:1fr;min-height:0}
  .threads{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .threads div{white-space:nowrap;border-bottom:0;border-right:1px solid var(--line)}
  .threads div.on{border-left:0;border-bottom:3px solid var(--gold)}
  .m{max-width:88%}
  .modal{padding:8px;align-items:flex-end}
  .modal .card{max-height:92vh;border-radius:16px 16px 0 0}
  .memes{grid-template-columns:1fr}
  .fly{padding:16px}
  h2{font-size:18px}
  .row>.btn{flex:1}
}
</style>
</head>

/* ---------- curriculum helpers ---------- */
function catOf(m){const g=(m.g||'').toLowerCase();if(m.k==='hw')return'hw';if(g.includes('weekly plan'))return'plan';if(g.includes('quiz'))return'quiz';if(g.includes('practice')||g.includes('video'))return'practice';return'study'}
const CATS=[['plan','Weekly Plan','P'],['study','Study Materials','S'],['quiz','Quizzes & Marking Schemes','Q'],['practice','Practice Links','L'],['hw','Homework (Google Classroom)','H']];
function weekCats(w){const o={};const seen=new Set();for(const m of w.mats){const c=catOf(m);const k=c+m.u;if(seen.has(k))continue;seen.add(k);(o[c]=o[c]||[]).push(m)}return o}
function weekLabel(w){return w?`Term ${w.term} · Week ${w.week}`:'Materials being prepared'}
function weekBox(y,idx,open){const w=CUR[y].weeks[idx];if(!w)return'<div class="mut">No materials for this week yet.</div>';const c=weekCats(w);
  return `<details class="wk" ${open?'open':''}><summary><span>${weekLabel(w)}</span><span class="mut small">${w.mats.length} items</span></summary><div class="body">`+
  CATS.filter(([k])=>c[k]).map(([k,n,l])=>`<div class="cat"><h4>${n}</h4>${c[k].map(m=>`<a class="mat" href="${m.u}" target="_blank" rel="noopener"><span class="ic i-${k}">${l}</span>${esc(m.t||m.g)}</a>`).join('')}</div>`).join('')+`</div></details>`}

      <div><h2>Past sessions</h2><div class="card">${my.filter(s=>s.status==='done').map(s=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${fmt(s.when)}</b> · ${weekLabel(CUR[f.year].weeks[s.week])}<div class="mut small">Teacher: ${esc(short(tch(s.teacher).name))}</div>${s.report?`<div class="small" style="margin-top:4px">“${esc(s.report)}”</div>`:''}</div>`).join('')||'<span class="mut">None yet.</span>'}</div>
      <div class="notice" style="margin-top:12px">Homework is submitted here on the platform – open the <b>Homework · الواجب</b> tab.<div class="ar" style="text-align:right">الواجب بيتسلم هنا على المنصة من تبويب «الواجب».</div></div></div></div>`}

    (hwWeeks(f).map(({i,w,tasks})=>{const h=hwOf(f.id,i);return `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${weekLabel(w)}</h3>${hwStatus(h)}</div>

function hwWeeks(f){const ws=CUR[f.year].weeks;const out=[];for(let i=0;i<=Math.min(f.week,ws.length-1);i++){const h=ws[i].mats.filter(m=>m.k==='hw');const seen=new Set();out.push({i,w:ws[i],tasks:h.filter(m=>!seen.has(m.u)&&seen.add(m.u))})}return out.reverse()}
function hwOf(fid,wi){return S.hw.find(h=>h.fam===fid&&h.week===wi)}
function hwStatus(h){if(!h)return'<span class="pill s-can">Not submitted · لم يُسلَّم</span>';if(h.status==='submitted')return'<span class="pill s-pay">Submitted – being marked · قيد التصحيح</span>';return`<span class="pill s-paid">Marked · ${h.mark} / ${h.total}</span>`}
const LEVELS=['Excellent · ممتاز','Very good · جيد جدًا','Good · جيد','Needs support · محتاج دعم'];
function reportCard(r){const f=fam(r.fam);return `<div class="card" style="margin-bottom:12px;border-left:5px solid var(--gold)"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${weekLabel(CUR[f.year].weeks[r.week])}</h3><span class="pill s-sch">${esc(r.level)}</span></div>
  <div class="grid g2" style="margin-top:10px"><div><div class="mut small">Attendance · الحضور</div><b>${esc(r.att)}</b></div><div><div class="mut small">Homework · الواجب</div><b>${esc(r.hwst)}</b></div></div>
  <div style="margin-top:10px"><div class="mut small">Strengths · نقاط القوة</div>${esc(r.good)}</div>
  <div style="margin-top:8px"><div class="mut small">To improve · محتاج يتحسن في</div>${esc(r.improve)}</div>
  <div style="margin-top:8px"><div class="mut small">Teacher’s comment · تعليق المدرس</div>${esc(r.comment)}</div>
  <div class="mut small" style="margin-top:8px">${esc(short(tch(r.teacher).name))} · ${fmt(r.at)}</div></div>`}

function sessCard(s,as){const f=fam(s.fam),dd=day(s.when),w=CUR[f.year].weeks[s.week];const can=joinable(s);

  return `<div class="sess"><div class="when"><b>${dd.d}</b>${dd.m}<div class="small">${dd.t}</div></div><div class="grow"><b>${who}</b><div class="mut small">${s.flying?'Urgent help'+(s.topic?': <b>'+esc(s.topic)+'</b>':''):(w?weekLabel(w):'')} · 60–75 min · Google Meet</div>
   ${as==='teacher'?`<div class="row small" style="margin-top:6px"><a href="#" data-prep="${s.id}">Open this week's materials</a></div>`:''}</div>

   ${as==='teacher'?`<button class="btn ghost" data-finish="${s.id}">Mark done</button>`:''}</div></div>`}

    <div class="card"><table><tr><th>Waiting</th><th>Contact</th><th>Student / level</th><th>Needs help with</th><th>How soon</th><th></th></tr>${S.flying.slice().sort((a,b)=>(a.status==='new'?0:1)-(b.status==='new'?0:1)).map(x=>`<tr><td>${x.status==='new'?`<span class="flag">${mins(x.at)} min</span>`:'<span class="pill s-done">Booked</span>'}</td><td>${esc(x.parent)}<div class="small">${esc(x.phone)}</div></td><td>${esc(x.student)}<div class="mut small">${x.level==='other'?'Other':CUR[x.level].name}</div></td><td>${esc(x.topic)}<div class="mut small">${esc(x.notes||'')}</div></td><td>${esc(x.need)}</td><td class="right">${x.status==='new'?`<button class="btn gold" data-flybook="${x.id}">⚡ Book now</button>`:''}</td></tr>`).join('')||'<tr><td class="mut">No requests.</td></tr>'}</table></div>
    <p class="mut small">Call the parent on the academy WhatsApp, agree the price, then press “Book now” – the teacher and parent get it instantly on the platform.</p>`}
  if(tab==='fol'){body=`<div class="card"><table><tr><th>Student</th><th>Teacher</th><th>Current week</th><th>Homework (this week)</th><th>Last report</th></tr>${S.families.map(f=>{const s=S.sessions.filter(x=>x.fam===f.id&&x.teacher).slice(-1)[0];const h=hwOf(f.id,f.week);const r=S.reports.filter(x=>x.fam===f.id).sort((a,b)=>b.week-a.week)[0];return `<tr><td><b>${esc(f.student)}</b><div class="mut small">${yName(f.year)}</div></td><td>${s?esc(tch(s.teacher).name):'—'}</td><td>${weekLabel(CUR[f.year].weeks[f.week])}</td><td>${hwStatus(h)}</td><td>${r?weekLabel(CUR[f.year].weeks[r.week])+'<div class="mut small">'+esc(r.level)+'</div>':'<span class="flag">No report yet</span>'}</td></tr>`}).join('')}</table></div>`}
  if(tab==='fam'){body=`<div class="card"><table><tr><th>Student</th><th>Year</th><th>Parent</th><th>Contact (coordinator only)</th><th>Current week</th><th>Sessions</th></tr>${S.families.map(f=>`<tr><td><b>${esc(f.student)}</b><div class="mut small">${f.type}</div></td><td>${yName(f.year)}</td><td>${esc(f.parent)}</td><td>${esc(f.phone)}<div class="mut small">${esc(f.email)} ${esc(f.country||'Egypt')}</div></td><td><select data-week="${f.id}">${CUR[f.year].weeks.map((w,i)=>`<option value="${i}" ${i===f.week?'selected':''}>${weekLabel(w)}</option>`).join('')}</select></td><td>${S.sessions.filter(s=>s.fam===f.id&&s.status==='done').length} done</td></tr>`).join('')}</table></div>`}
  if(tab==='tch'){body=`<div class="card"><table><tr><th>Teacher</th><th>Years</th><th>Rate / session</th><th>Done this month</th><th>Due</th></tr>${S.teachers.map(t=>{const d=S.sessions.filter(s=>s.teacher===t.id&&s.status==='done').length;return `<tr><td><b>${esc(t.name)}</b></td><td>${t.years.join(', ')}</td><td><select data-rate="${t.id}">${[200,250,300].map(r=>`<option ${r===t.rate?'selected':''} value="${r}">${money(r)}</option>`).join('')}</select></td><td>${d}</td><td>${money(d*t.rate)}</td></tr>`}).join('')}</table></div>`}
  if(tab==='fin'){const done=S.sessions.filter(s=>s.status==='done');const paid=S.sessions.filter(s=>['paid','scheduled','done'].includes(s.status));const rev=paid.filter(s=>!s.cur||s.cur==='EGP').reduce((a,s)=>a+s.price,0);const pay=done.reduce((a,s)=>a+tch(s.teacher).rate,0);
    body=`<div class="grid g4"><div class="card stat"><div class="mut small">Payments received</div><div class="n">${money(rev)}</div></div><div class="card stat"><div class="mut small">Sessions completed</div><div class="n">${done.length}</div></div><div class="card stat"><div class="mut small">Teacher pay due</div><div class="n">${money(pay)}</div></div><div class="card stat"><div class="mut small">Net (completed sessions)</div><div class="n">${money(done.filter(s=>!s.cur||s.cur==='EGP').reduce((a,s)=>a+s.price,0)-pay)}</div></div></div>
    <div class="card" style="margin-top:14px"><h3>Teacher payouts</h3><table><tr><th>Teacher</th><th>Sessions</th><th>Rate</th><th class="right">Due</th></tr>${S.teachers.map(t=>{const d=done.filter(s=>s.teacher===t.id).length;return `<tr><td>${esc(t.name)}</td><td>${d}</td><td>${money(t.rate)}</td><td class="right">${money(d*t.rate)}</td></tr>`}).join('')}</table></div>`}
  if(tab==='msg'){const ths=[...new Set(S.messages.map(m=>m.thread))];body=`<p class="mut small">The coordinator sees every conversation. Messages containing phone numbers, emails, links or social-media names are blocked automatically and flagged here.</p>`+chatView(ths.map(t=>[t,threadName(t)]),'admin')}
  return tabsHtml(tabs)+body}
function threadName(t){const p=t.split(':');if(p[0]==='fam')return'Team ↔ '+fam(p[1]).parent;if(p[0]==='staff')return'Team ↔ '+tch(p[1]).name;if(p[0]==='tf')return tch(p[1]).name+' ↔ '+fam(p[2]).parent;return t}

/* ---------- chat ---------- */
function chatView(threads,as){thread=thread&&threads.find(t=>t[0]===thread)?thread:(threads[0]||[])[0];
  const ms=S.messages.filter(m=>m.thread===thread);
  const meKey={parent:'parent',teacher:'teacher',admin:'admin'}[as];
  const label=m=>({admin:'Educate Me Up team',teacher:as==='parent'?'Teacher':(as==='admin'?tch(thread.split(':')[1])?.name||'Teacher':'You'),parent:as==='teacher'?'Parent':(as==='admin'?'Parent':'You')}[m.from]);
  return `<div class="chat"><div class="threads">${threads.map(([id,n])=>{const fl=S.messages.some(m=>m.thread===id&&m.blocked);return `<div class="${id===thread?'on':''}" data-thread="${id}">${esc(n)}${as==='admin'&&fl?' <span class="flag">⚠</span>':''}</div>`}).join('')}</div>
   <div class="msgs"><div class="msglist">${ms.map(m=>{const mine=m.from===meKey;if(m.blocked&&as!=='admin'&&!mine)return'';return `<div class="m ${m.blocked?'blocked':mine?'me':'them'}">${m.blocked&&as!=='admin'?'This message was not sent: contact details can’t be shared on Educate Me Up.':esc(m.text)}${m.blocked&&as==='admin'?'<div class="flag small">Blocked – contact details</div>':''}<div class="meta">${label(m)} · ${fmt(m.at)}</div></div>`}).join('')||'<div class="mut">No messages yet.</div>'}</div>
   <form class="compose" id="compose"><input name="t" placeholder="Write a message…" autocomplete="off"><button class="btn">Send</button></form></div></div>`}

function tabsHtml(t){return `<div class="tabs">${t.map(([k,n])=>`<button class="${k===tab?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>`}

/* ---------- modals ---------- */
function modal(html){const l=document.getElementById('layer');l.innerHTML=`<div class="modal"><div class="card">${html}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="mClose">Close</button></div></div></div>`;document.getElementById('mClose').onclick=()=>l.innerHTML='';return l}
function closeModal(){document.getElementById('layer').innerHTML=''}
function schedModal(id){const s=S.sessions.find(x=>x.id===id),f=fam(s.fam);const tl=S.teachers.filter(t=>t.years.includes(f.year));
  const l=modal(`<h2>Assign & schedule</h2><p class="mut">${esc(f.student)} · ${yName(f.year)} · ${f.type}</p>
  <label>Teacher</label><select id="sT">${tl.map(t=>`<option value="${t.id}" ${t.id===s.teacher?'selected':''}>${esc(t.name)} – ${money(t.rate)}/session</option>`).join('')}</select>
  <div class="grid g2"><div><label>Date</label><input type="date" id="sD" value="${(s.when||new Date().toISOString()).slice(0,10)}"></div><div><label>Time</label><input type="time" id="sH" value="${s.when?new Date(s.when).toTimeString().slice(0,5):'18:00'}"></div></div>
  <label>Week to teach</label><select id="sW">${CUR[f.year].weeks.map((w,i)=>`<option value="${i}" ${i===s.week?'selected':''}>${weekLabel(w)}</option>`).join('')}</select>
  <label>Google Meet link (created from the academy account)</label><input id="sM" value="${esc(s.meet||'https://meet.google.com/new-'+Math.random().toString(36).slice(2,6))}">
  <div style="margin-top:12px"><button class="btn gold" id="sOk">Save & notify teacher and family</button></div>`);
  l.querySelector('#sOk').onclick=()=>{s.teacher=l.querySelector('#sT').value;s.when=new Date(l.querySelector('#sD').value+'T'+l.querySelector('#sH').value).toISOString();s.week=+l.querySelector('#sW').value;s.meet=l.querySelector('#sM').value;s.status='scheduled';
    S.messages.push({id:'m'+Date.now(),thread:'staff:'+s.teacher,from:'admin',text:`New session: ${short(f.student)} (${yName(f.year)}) on ${fmt(s.when)} – ${weekLabel(CUR[f.year].weeks[s.week])}.`,at:new Date().toISOString()});
    S.messages.push({id:'m'+Date.now()+1,thread:'fam:'+f.id,from:'admin',text:`Your session is confirmed for ${fmt(s.when)}. Join from your account.`,at:new Date().toISOString()});
    save();closeModal();render();toast('Scheduled – teacher and family notified on the platform')}}
function finishModal(id){const s=S.sessions.find(x=>x.id===id),f=fam(s.fam);
  const l=modal(`<h2>Session report</h2><p class="mut">${esc(short(f.student))} · ${weekLabel(CUR[f.year].weeks[s.week])}</p><label>What was covered / notes for the family</label><textarea id="rp" rows="4"></textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="adv" checked style="width:auto"> Move student to the next week</label><div style="margin-top:12px"><button class="btn green" id="rOk">Save report</button></div>`);
  l.querySelector('#rOk').onclick=()=>{const r=l.querySelector('#rp').value.trim();if(contactLeak(r)){toast('Remove contact details from the report');return}s.report=r;s.status='done';if(l.querySelector('#adv').checked&&f.week<CUR[f.year].weeks.length-1)f.week++;save();closeModal();render();toast('Report saved – visible to the family and coordinator')}}

function priceFields(price,cur,type){return `<div class="grid g2"><div><label>Price per session</label><input type="number" id="pP" value="${price}"></div><div><label>Currency</label><select id="pC">${['EGP','USD','SAR','AED','KWD','GBP'].map(c=>`<option ${c===(cur||'EGP')?'selected':''}>${c}</option>`).join('')}</select></div></div>
  <p class="mut small">Suggested inside Egypt (private): Year 6 & 8 – 500 EGP · Year 7 & 9 – 400 EGP. Set any price for groups or families outside Egypt. This price is shown to the parent only, never on the public website.</p>`}
const INSTAPAY='academy@instapay'; /* to be replaced */
const ld=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  <div class="grid g2"><div><label>Date</label><input type="date" id="nD" value="${ld(pre.flying?soon:new Date())}"></div><div><label>Time</label><input type="time" id="nH" value="${pre.flying?soon.toTimeString().slice(0,5):'18:00'}"></div></div>

    const l2=modal(`<h2>Booking created ✅</h2><p class="mut small">Copy this message and send it to the parent on the academy WhatsApp.</p><div class="copybox" id="cpy">${esc(msg)}</div><div style="margin-top:10px"><button class="btn gold" id="cpB">Copy message</button></div>`);
    l2.querySelector('#cpB').onclick=()=>{navigator.clipboard.writeText(msg).then(()=>toast('Copied'),()=>toast('Select the text and copy it'))};render()}}
function acceptModal(rid){const r=S.requests.find(x=>x.id===rid);
  const l=modal(`<h2>Create booking</h2><p class="mut">${esc(r.student)} · ${yName(r.year)} · ${r.type} · ${esc(r.country||'Egypt')}</p>${priceFields(PRICE[r.year],'EGP')}<div style="margin-top:12px"><button class="btn gold" id="aOk">Create booking – awaiting payment</button></div>`);
  l.querySelector('#aOk').onclick=()=>{const id='f'+Date.now();S.families.push({id,parent:r.parent,phone:r.phone,email:'',country:r.country||'Egypt',student:r.student,year:r.year,type:r.type,week:0});S.sessions.push({id:'s'+Date.now(),fam:id,status:'pending',price:+l.querySelector('#pP').value,cur:l.querySelector('#pC').value,teacher:null,when:null,meet:'',week:0,payRef:''});r.status='done';save();closeModal();tab='pipe';render();toast('Booking created – awaiting payment')}}
function priceModal(sid){const s=S.sessions.find(x=>x.id===sid),f=fam(s.fam);
  const l=modal(`<h2>Session price</h2><p class="mut">${esc(f.student)} · ${yName(f.year)} · ${f.type}</p>${priceFields(s.price,s.cur)}<div style="margin-top:12px"><button class="btn gold" id="pOk">Save price</button></div>`);
  l.querySelector('#pOk').onclick=()=>{s.price=+l.querySelector('#pP').value;s.cur=l.querySelector('#pC').value;save();closeModal();render();toast('Price updated')}}

function markModal(id){const h=S.hw.find(x=>x.id===id),f=fam(h.fam);
  const l=modal(`<h2>Mark homework</h2><p class="mut">${esc(short(f.student))} · ${weekLabel(CUR[f.year].weeks[h.week])}</p><div class="small">Files: ${h.files.map(esc).join(', ')}</div>
  <div class="grid g2"><div><label>Mark</label><input type="number" id="hM" value="${h.mark??''}"></div><div><label>Out of</label><input type="number" id="hT" value="${h.total??50}"></div></div>
  <label>Feedback for the student & parent</label><textarea id="hF" rows="3">${esc(h.feedback||'')}</textarea>
  <label>Upload the corrected copy</label><input type="file" id="hC" accept="image/*,.pdf">
  <div style="margin-top:12px"><button class="btn green" id="hOk">Return to student</button></div>`);
  l.querySelector('#hOk').onclick=()=>{const fb=l.querySelector('#hF').value.trim();if(contactLeak(fb)){toast('Remove contact details from the feedback');return}const fl=l.querySelector('#hC').files[0];h.mark=+l.querySelector('#hM').value;h.total=+l.querySelector('#hT').value;h.feedback=fb;if(fl)h.corrected=fl.name;h.status='returned';save();closeModal();render();toast('Returned – parent can see the mark and feedback')}}
function repModal(fid){const f=fam(fid);const wi=f.week;const h=hwOf(fid,wi)||hwOf(fid,wi-1);const ss=S.sessions.filter(s=>s.fam===fid&&s.week===wi);

    S.reports.push({id:'w'+Date.now(),fam:fid,teacher:S.me.teacher,week:wi,level:g('#rL'),att:g('#rA'),hwst:g('#rH'),good:g('#rG'),improve:g('#rI'),comment:g('#rC'),at:new Date().toISOString()});save();closeModal();render();toast('Report sent – visible in the parent’s account')}}

function bindFly(form,inModal){form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));S.flying.unshift({id:'fl'+Date.now(),...d,at:new Date().toISOString(),status:'new'});save();
  form.outerHTML='<div class="ok"><b>⚡ Request received!</b> We’ll call you on WhatsApp within minutes with the teacher, the time and the price.<div class="ar" style="text-align:right;margin-top:4px">وصلنا طلبك! هنكلمك على الواتساب في دقايق بالمدرس والميعاد والسعر.</div></div>'}}
/* ---------- events ---------- */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;thread=null;render()});
  document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{thread=b.dataset.thread;render()});
  document.querySelectorAll('[data-ly]').forEach(b=>b.onclick=()=>{window._ly=b.dataset.ly;render()});
  const gb=document.getElementById('goBook');if(gb)gb.onclick=()=>document.getElementById('bookCard').scrollIntoView({behavior:'smooth'});
  const bf=document.getElementById('bookForm');if(bf){
    bf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(bf));S.requests.unshift({id:'r'+Date.now(),...d,at:new Date().toISOString(),status:'new'});save();bf.outerHTML='<div class="ok"><b>Request received.</b> Our team will contact you on WhatsApp with the price, the available times and the InstaPay details.</div>'}}
  document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{const s=S.sessions.find(x=>x.id===b.dataset.confirm);s.status=(s.teacher&&s.when)?'scheduled':'paid';s.payRef=s.payRef||'InstaPay – confirmed';save();render();toast('Payment confirmed')});
  document.querySelectorAll('[data-sched]').forEach(b=>b.onclick=()=>schedModal(b.dataset.sched));
  document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>finishModal(b.dataset.finish));
  document.querySelectorAll('[data-prep]').forEach(b=>b.onclick=e=>{e.preventDefault();const s=S.sessions.find(x=>x.id===b.dataset.prep),f=fam(s.fam);modal(`<h2>${esc(short(f.student))} – lesson materials</h2>${weekBox(f.year,s.week,true)}`)});
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const s=S.sessions.find(x=>x.id===b.dataset.pay);const l=modal(`<h2>Upload InstaPay receipt</h2><p class="mut">Amount: <b>${money(s.price,s.cur)}</b></p><input type="file" id="rc" accept="image/*"><div style="margin-top:12px"><button class="btn gold" id="rcOk">Send to the team</button></div>`);l.querySelector('#rcOk').onclick=()=>{const fl=l.querySelector('#rc').files[0];s.payRef='Receipt uploaded'+(fl?' ('+fl.name+')':'');save();closeModal();render();toast('Receipt sent – the team will confirm and schedule')}});
  document.querySelectorAll('[data-newbook]').forEach(b=>b.onclick=()=>{const f=fam(S.me.parent);S.sessions.push({id:'s'+Date.now(),fam:f.id,status:'pending',price:PRICE[f.year],cur:'EGP',teacher:null,when:null,meet:'',week:f.week,payRef:''});save();render();toast('Booking created – please pay to confirm')});
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptModal(b.dataset.accept));
  document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>priceModal(b.dataset.price));
  document.querySelectorAll('[data-newbk]').forEach(b=>b.onclick=newBookingModal);
  document.querySelectorAll('[data-flybook]').forEach(b=>b.onclick=()=>{const x=S.flying.find(y=>y.id===b.dataset.flybook);newBookingModal({flying:true,fid:x.id,parent:x.parent,phone:x.phone,student:x.student,level:x.level==='other'?'gen':x.level,topic:x.topic})});
  document.querySelectorAll('[data-avail]').forEach(b=>b.onclick=()=>{const tt=tch(S.me.teacher);tt.avail=!tt.avail;save();render()});
  document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.goto).scrollIntoView({behavior:'smooth'})});
  document.querySelectorAll('[data-flyp]').forEach(b=>b.onclick=()=>{const f=fam(S.me.parent);const l=modal(`<h2>⚡ Flying Session</h2>${flyForm({parent:f.parent,phone:f.phone,student:f.student,level:f.year})}`);bindFly(l.querySelector('#flyForm'),true)});
  const ff=document.getElementById('flyForm');if(ff)bindFly(ff,false);
  document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>markModal(b.dataset.mark));
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>repModal(b.dataset.rep));
  document.querySelectorAll('[data-hwup]').forEach(b=>b.onclick=()=>{const wi=+b.dataset.hwup;const inp=document.querySelector(`[data-hwfile="${wi}"]`);const fs=[...inp.files].map(x=>x.name);if(!fs.length){toast('Choose the photos or PDF first · اختار الملفات الأول');return}const f=fam(S.me.parent);let h=hwOf(f.id,wi);if(h){h.files=fs;h.status='submitted';delete h.mark}else{S.hw.push({id:'h'+Date.now(),fam:f.id,week:wi,files:fs,status:'submitted',at:new Date().toISOString()})}save();render();toast('Homework submitted · تم التسليم')});
  document.querySelectorAll('[data-week]').forEach(sel=>sel.onchange=()=>{fam(sel.dataset.week).week=+sel.value;save();toast('Week updated')});
  document.querySelectorAll('[data-rate]').forEach(sel=>sel.onchange=()=>{tch(sel.dataset.rate).rate=+sel.value;save();render()});
  const c=document.getElementById('compose');if(c)c.onsubmit=e=>{e.preventDefault();const t=c.t.value.trim();if(!t||!thread)return;const from={parent:'parent',teacher:'teacher',admin:'admin'}[role];const bl=role!=='admin'&&contactLeak(t);
    S.messages.push({id:'m'+Date.now(),thread,from,text:t,at:new Date().toISOString(),blocked:bl});save();render();if(bl)toast('Blocked: phone numbers, emails, links and social apps can’t be shared')};
  document.querySelectorAll('table').forEach(tb=>{const hs=[...tb.querySelectorAll('th')].map(h=>h.textContent.trim());tb.querySelectorAll('tr').forEach(r=>[...r.children].forEach((c,i)=>{if(c.tagName==='TD'&&hs[i])c.dataset.label=hs[i]}))});
  const ml=document.querySelector('.msglist');if(ml)ml.scrollTop=ml.scrollHeight;
}
render();
</script>
</body>
</html>
